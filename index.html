                    <div className="flex gap-2 no-print">
                        <button onClick={() => setView('summary')} className={`px-4 py-2 rounded-lg text-sm font-medium ${view === 'summary' ? 'bg-slate-900 text-white' : 'bg-white border border-slate-300 text-slate-600'}`}>สรุปทั้งหมด</button>
                        <button onClick={() => setView('daily')} className={`px-4 py-2 rounded-lg text-sm font-medium ${view === 'daily' ? 'bg-slate-900 text-white' : 'bg-white border border-slate-300 text-slate-600'}`}>รายงานรายวัน (สำหรับเบิกจ่าย)</button>
                        <button onClick={() => setView('late')} className={`px-4 py-2 rounded-lg text-sm font-medium ${view === 'late' ? 'bg-slate-900 text-white' : 'bg-white border border-slate-300 text-slate-600'}`}>ประวัติเวลาเช็คชื่อ</button>
                    </div>

                    {view === 'late' ? (
                        <PunctualityReport roster={roster} settings={settings} attendanceMap={attendanceMap} />
                    ) : view === 'daily' ? (
                        <DailyReport roster={roster} settings={settings} attendanceMap={attendanceMap} />
                    ) : (
                    <React.Fragment>
                    <div className="print-header">
                        <h2 className="text-xl font-bold mb-1">รายงานสรุปการเข้าเรียน {settings.CampName}</h2>
                        <p>ข้อมูล ณ วันที่ {thaiDate(todayKey())}</p>
                    </div>
                    <div className="flex flex-wrap justify-between items-end gap-3 no-print">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">รายงานสรุปการเข้าเรียน</h2>
                            <label className="flex items-center gap-2 mt-2 text-sm text-slate-600">
                                <input type="checkbox" checked={onlyAtRisk} onChange={e => setOnlyAtRisk(e.target.checked)} />
                                แสดงเฉพาะนักเรียนที่มีช่วงใดช่วงหนึ่งไม่ครบเกณฑ์
                            </label>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={exportExcel} className="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700"><i className="fas fa-file-excel"></i> ส่งออก Excel</button>
                            <button onClick={() => window.print()} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700"><i className="fas fa-print"></i> พิมพ์ / PDF</button>
                        </div>
                    </div>
                    {phases.length === 0 && (
                        <div className="bg-amber-50 border border-amber-200 text-amber-800 text-sm p-4 rounded-xl no-print">
                            ยังไม่ได้ตั้งค่าช่วงเวลาการเข้าค่าย (Phases) กรุณาไปที่แท็บตั้งค่าเพื่อเพิ่มช่วงเวลาก่อน
                        </div>
                    )}
                    <div className="relative no-print">
                        <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="ค้นหาจากรหัสหรือชื่อนักเรียน..."
                            className="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm" />
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-area">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-100 border-b border-slate-200">
                                    <tr>
                                        <th className="p-3 font-semibold text-slate-700">ที่</th>
                                        <th className="p-3 font-semibold text-slate-700">รหัส</th>
                                        <th className="p-3 font-semibold text-slate-700">ชื่อ-สกุล</th>
                                        {groups.map(g => (
                                            <th key={g.key} className="p-3 font-semibold text-slate-700 text-center">{g.name}<br /><span className="font-normal text-xs text-slate-400">(ต้องการ {g.minPercent}%)</span></th>
                                        ))}
                                        <th className="p-3 font-semibold text-slate-700 text-center">รวมทั้งหมด</th>
                                        <th className="p-3 font-semibold text-slate-700 text-center">สถานะ</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {visibleRows.length === 0 ? (
                                        <tr><td colSpan={4 + groups.length} className="p-6 text-center text-slate-500">ไม่มีข้อมูล</td></tr>
                                    ) : visibleRows.map((r, i) => (
                                        <tr key={r.id} className={r.anyAtRisk ? 'bg-rose-50' : ''}>
                                            <td className="p-3">{i + 1}</td>
                                            <td className="p-3 font-mono text-slate-600">{r.id}</td>
                                            <td className="p-3 font-medium text-slate-900">{r.name}</td>
                                            {r.perGroup.map((p, idx) => (
                                                <td key={idx} className="p-3 text-center">
                                                    <div className={`font-bold ${p.isAtRisk ? 'text-rose-600' : 'text-emerald-600'}`}>{p.percent.toFixed(1)}%</div>
                                                    <div className="text-[11px] text-slate-400">ม.{p.present} ล.{p.leave} ข.{p.absent}</div>
                                                </td>
                                            ))}
                                            <td className="p-3 text-center font-bold">{r.overall.percent.toFixed(1)}%</td>
                                            <td className="p-3 text-center">
                                                {r.anyAtRisk ? <span className="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-bold">เสี่ยงหมดสิทธิ์สอบ</span>
                                                    : <span className="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-bold">ผ่านเกณฑ์</span>}
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    </React.Fragment>
                    )}
                </div>
            );
        }


        /* ============================== ATTENDANCE LOG REPORT (NEUTRAL: TIME + HOW CHECKED) ============================== */
        // เก็บบันทึกเวลา/วิธีเช็คชื่อไว้ดูเฉยๆ ไม่ตัดสินว่าสาย ไม่ติดป้ายเตือน และไม่มีผลกับชั่วโมงเรียนหรือคะแนน
        function PunctualityReport({ roster, settings, attendanceMap }) {
            const [search, setSearch] = useState('');
            const [expanded, setExpanded] = useState(null);
            const today = todayKey();
            const nowBkk = bkkTime(new Date().toISOString());
            const nowDec = nowBkk ? nowBkk.dec : 24;
            const dates = Object.keys(attendanceMap).filter(d => d <= today).sort();

            const rows = useMemo(() => {
                return roster.map(s => {
                    const events = [];
                    let self = 0, byTeacher = 0, absent = 0, leave = 0;
                    dates.forEach(date => {
                        const rec = (attendanceMap[date] && attendanceMap[date][s.id]) || {};
                        ['am', 'pm'].forEach(sess => {
                            const end = timeToDec(sess === 'am' ? settings.AmEnd : settings.PmEnd);
                            const st = rec[sess];
                            const t = bkkTime(rec[sess + 'Time']);
                            if (st === 'present') {
                                if (rec[sess + 'Method'] === 'teacher') { byTeacher++; events.push({ date, sess, kind: 'teacher', time: t ? t.str : '' }); }
                                else { self++; events.push({ date, sess, kind: 'self', time: t ? t.str : '' }); }
                            } else if (st === 'leave') {
                                leave++; events.push({ date, sess, kind: 'leave', time: '' });
                            } else {
                                if (date === today && nowDec < end) return; // รอบวันนี้ที่ยังไม่หมดเวลา ยังไม่นับ
                                absent++; events.push({ date, sess, kind: 'none', time: '' });
                            }
                        });
                    });
                    return { ...s, self, byTeacher, absent, leave, events };
                });
            }, [roster, attendanceMap, settings]);

            const visible = useMemo(() => {
                const q = search.trim().toLowerCase();
                if (!q) return rows;
                return rows.filter(r => r.id.toLowerCase().includes(q) || r.name.toLowerCase().includes(q) || String(r.no || '').toLowerCase() === q);
            }, [rows, search]);

            const kindLabel = { self: 'เช็คเอง (GPS)', teacher: 'ครูเช็คให้', leave: 'ลา', none: 'ไม่ได้เช็คชื่อ' };
            const shortDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });

            const exportExcel = () => {
                const summary = rows.map(r => ({ 'เลขที่': r.no || '', 'รหัส': r.id, 'ชื่อ-สกุล': r.name, 'เช็คเอง (ครั้ง)': r.self, 'ครูเช็คให้ (ครั้ง)': r.byTeacher, 'ลา (ครั้ง)': r.leave, 'ไม่ได้เช็คชื่อ (ครั้ง)': r.absent }));
                const detail = [];
                rows.forEach(r => r.events.forEach(e => detail.push({
                    'เลขที่': r.no || '', 'รหัส': r.id, 'ชื่อ-สกุล': r.name, 'วันที่': e.date, 'รอบ': e.sess === 'am' ? 'เช้า' : 'บ่าย',
                    'สถานะ': kindLabel[e.kind], 'เวลาที่บันทึก': e.time
                })));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'สรุป');
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detail.length ? detail : [{ 'หมายเหตุ': 'ยังไม่มีรายการ' }]), 'รายละเอียด');
                XLSX.writeFile(wb, `ประวัติเวลาเช็คชื่อ_${todayKey()}.xlsx`);
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-wrap justify-between items-end gap-3">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">ประวัติเวลาเช็คชื่อ</h2>
                            <p className="text-sm text-slate-500 mt-1">
                                บันทึกไว้ดูข้อมูลเท่านั้น ไม่ตัดสินว่ามาสาย ไม่มีผลกับชั่วโมงเรียนหรือคะแนน และนักเรียนมองไม่เห็นหน้านี้ · "ครูเช็คให้" ครอบคลุมทุกกรณี เช่น เรียนออนไลน์ที่บ้าน หรือเช็คเองไม่ได้ · เวลาอ้างอิงจากเซิร์ฟเวอร์
                            </p>
                        </div>
                        <button onClick={exportExcel} className="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700"><i className="fas fa-file-excel"></i> ส่งออก Excel</button>
                    </div>
                    <div className="relative">
                        <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="ค้นหาจากเลขที่ รหัส หรือชื่อ..." className="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm" />
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-100 border-b border-slate-200">
                                    <tr>
                                        <th className="p-3 font-semibold text-slate-700">เลขที่</th>
                                        <th className="p-3 font-semibold text-slate-700">รหัส</th>
                                        <th className="p-3 font-semibold text-slate-700">ชื่อ-สกุล</th>
                                        <th className="p-3 font-semibold text-slate-700 text-center">เช็คเอง</th>
                                        <th className="p-3 font-semibold text-slate-700 text-center">ครูเช็คให้</th>
                                        <th className="p-3 font-semibold text-slate-700 text-center">ลา</th>
                                        <th className="p-3 font-semibold text-slate-700 text-center">ไม่ได้เช็คชื่อ</th>
                                        <th className="p-3 font-semibold text-slate-700 text-center">รายละเอียด</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {visible.length === 0 ? (
                                        <tr><td colSpan="8" className="p-6 text-center text-slate-500">ไม่มีข้อมูล</td></tr>
                                    ) : visible.map(r => (
                                        <React.Fragment key={r.id}>
                                            <tr>
                                                <td className="p-3 font-bold text-slate-700">{r.no || '-'}</td>
                                                <td className="p-3 font-mono text-slate-600">{r.id}</td>
                                                <td className="p-3 font-medium text-slate-900">{r.name}</td>
                                                <td className="p-3 text-center text-slate-700">{r.self}</td>
                                                <td className="p-3 text-center text-slate-700">{r.byTeacher}</td>
                                                <td className="p-3 text-center text-slate-700">{r.leave}</td>
                                                <td className="p-3 text-center text-slate-700">{r.absent}</td>
                                                <td className="p-3 text-center">
                                                    <button disabled={r.events.length === 0} onClick={() => setExpanded(expanded === r.id ? null : r.id)} className="text-blue-600 bg-blue-50 hover:bg-blue-100 disabled:opacity-40 px-2.5 py-1.5 rounded-lg text-xs font-medium">
                                                        <i className={`fas ${expanded === r.id ? 'fa-chevron-up' : 'fa-chevron-down'}`}></i>
                                                    </button>
                                                </td>
                                            </tr>
                                            {expanded === r.id && (
                                                <tr>
                                                    <td colSpan="8" className="p-3 bg-slate-50">
                                                        <div className="flex flex-wrap gap-2">
                                                            {r.events.map((e, i) => (
                                                                <span key={i} className="text-xs px-2 py-1 rounded border bg-white border-slate-200 text-slate-600">
                                                                    {shortDate(e.date)} {e.sess === 'am' ? 'เช้า' : 'บ่าย'} · {kindLabel[e.kind]}{e.time ? ` (${e.time} น.)` : ''}
                                                                </span>
                                                            ))}
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                        </React.Fragment>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        /* ============================== DAILY REPORT (FOR REIMBURSEMENT) ============================== */
        function DailyReport({ roster, settings, attendanceMap }) {
            const [selectedDate, setSelectedDate] = useState(todayKey());
            const [demoMode, setDemoMode] = useState(false);
            const dayRec = attendanceMap[selectedDate] || {};

            // โหมดจำลอง: สุ่มสถานะแบบตายตัว (ไม่สุ่มใหม่ทุกครั้ง) เพื่อดูตัวอย่างหน้าตาเอกสาร ไม่บันทึกข้อมูลจริง
            const demoStatusFor = (idx, offset) => {
                const seed = (idx * 7 + offset) % 10;
                if (seed < 7) return 'present';
                if (seed < 9) return 'leave';
                return 'absent';
            };

            const rows = useMemo(() => {
                return roster.map((s, i) => {
                    if (demoMode) {
                        return { no: i + 1, id: s.id, name: s.name, am: demoStatusFor(i, 0), pm: demoStatusFor(i, 3), leaveDoc: demoStatusFor(i, 0) === 'leave' ? 'ตัวอย่าง: ใบรับรองแพทย์' : '' };
                    }
                    return {
                        no: i + 1, id: s.id, name: s.name,
                        am: (dayRec[s.id] && dayRec[s.id].am) || null,
                        pm: (dayRec[s.id] && dayRec[s.id].pm) || null,
                        leaveDoc: (dayRec[s.id] && dayRec[s.id].leaveDoc) || ''
                    };
                });
            }, [roster, dayRec, demoMode]);

            const summary = useMemo(() => {
                let amPresent = 0, amAbsent = 0, amLeave = 0, pmPresent = 0, pmAbsent = 0, pmLeave = 0;
                rows.forEach(r => {
                    if (r.am === 'present') amPresent++; else if (r.am === 'leave') amLeave++; else amAbsent++;
                    if (r.pm === 'present') pmPresent++; else if (r.pm === 'leave') pmLeave++; else pmAbsent++;
                });
                return { amPresent, amAbsent, amLeave, pmPresent, pmAbsent, pmLeave };
            }, [rows]);

            const label = (st) => st ? STATUS_META[st].label : 'ขาด';

            const exportExcel = () => {
                const data = rows.map(r => ({
                    'ลำดับ': r.no, 'รหัส': r.id, 'ชื่อ-สกุล': r.name,
                    'รอบเช้า': label(r.am), 'รอบบ่าย': label(r.pm), 'หมายเหตุ/หลักฐานการลา': r.leaveDoc
                }));
                data.push({});
                data.push({ 'ลำดับ': 'ลงชื่อ..................................................ผู้รับรอง' });
                data.push({ 'ลำดับ': settings.CertifierName ? `(${settings.CertifierName})` : '(..................................................)' });
                data.push({ 'ลำดับ': `ตำแหน่ง ${settings.CertifierPosition || '..................................................'}` });
                data.push({ 'ลำดับ': 'วันที่.............เดือน..............................พ.ศ..............' });
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'รายงานรายวัน');
                XLSX.writeFile(wb, `รายงานรายวัน_${selectedDate}${demoMode ? '_ตัวอย่าง' : ''}.xlsx`);
            };

            // ส่งออกเป็น Word (.doc) จริง เปิดแก้ไขต่อใน Microsoft Word / Google Docs ได้เลย
            // ใช้เทคนิคตาราง 2 คอลัมน์ซ้อนกัน (ตารางใหญ่ 1 แถว 2 ช่อง แต่ละช่องมีตารางย่อยของตัวเอง)
            // เพราะ Word ไม่รองรับ CSS column-count แต่รองรับตารางซ้อนตารางได้ดีมาก ช่วยให้พอดี 2 หน้าแม้ใช้ฟอนต์ 16pt
            const exportWord = () => {
                const FONT = `'TH SarabunIT๙','TH Sarabun New','Sarabun',sans-serif`;
                const tableRows = rows.map(r => `
                    <tr>
                        <td style="border:1px solid #999;padding:4px 6px;text-align:center;">${r.no}</td>
                        <td style="border:1px solid #999;padding:4px 6px;">${r.id}</td>
                        <td style="border:1px solid #999;padding:4px 6px;">${r.name}</td>
                        <td style="border:1px solid #999;padding:4px 6px;text-align:center;">${label(r.am)}</td>
                        <td style="border:1px solid #999;padding:4px 6px;text-align:center;">${label(r.pm)}</td>
                        <td style="border:1px solid #999;padding:4px 6px;">${r.leaveDoc || ''}</td>
                    </tr>`).join('');

                const certName = settings.CertifierName ? `(${settings.CertifierName})` : '(..................................................)';
                const certPosition = settings.CertifierPosition ? settings.CertifierPosition : '..................................................';

                const html = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="utf-8">
                    <title>รายงานรายวัน</title>
                    <style>
                        @page Section1 { size: 21cm 29.7cm; margin: 1.5cm 1.2cm 1.5cm 1.2cm; mso-header-margin: .5in; mso-footer-margin: .5in; mso-paper-source: 0; }
                        div.Section1 { page: Section1; }
                        body { font-family: ${FONT}; font-size: 16pt; }
                    </style>
                </head>
                <body>
                    <div class="Section1">
                        <h2 style="text-align:center;margin-bottom:4px;font-family:${FONT};">รายงานเช็คชื่อรายวัน ${settings.CampName}</h2>
                        <p style="text-align:center;margin-top:0;">วันที่ ${thaiDate(selectedDate)}${demoMode ? ' (ตัวอย่าง/ข้อมูลจำลอง)' : ''}</p>
                        <p>รอบเช้า: มา ${summary.amPresent} / ลา ${summary.amLeave} / ขาด ${summary.amAbsent} คน &nbsp;&nbsp; รอบบ่าย: มา ${summary.pmPresent} / ลา ${summary.pmLeave} / ขาด ${summary.pmAbsent} คน &nbsp;&nbsp; รวมทั้งหมด ${roster.length} คน</p>
                        <table style="border-collapse:collapse;width:100%;">
                            <thead>
                                <tr style="background:#f1f5f9;">
                                    <th style="border:1px solid #999;padding:4px 6px;">ที่</th>
                                    <th style="border:1px solid #999;padding:4px 6px;">รหัส</th>
                                    <th style="border:1px solid #999;padding:4px 6px;">ชื่อ-สกุล</th>
                                    <th style="border:1px solid #999;padding:4px 6px;">รอบเช้า</th>
                                    <th style="border:1px solid #999;padding:4px 6px;">รอบบ่าย</th>
                                    <th style="border:1px solid #999;padding:4px 6px;">หมายเหตุ / หลักฐานการลา</th>
                                </tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                        <br/>
                        <table style="width:60%;margin-left:auto;margin-right:auto;">
                            <tr><td style="text-align:center;padding-top:20px;">ลงชื่อ..................................................ผู้รับรอง</td></tr>
                            <tr><td style="text-align:center;padding-top:10px;">${certName}</td></tr>
                            <tr><td style="text-align:center;padding-top:10px;">ตำแหน่ง ${certPosition}</td></tr>
                            <tr><td style="text-align:center;padding-top:10px;">วันที่.............เดือน..............................พ.ศ..............</td></tr>
                        </table>
                    </div>
                </body>
                </html>`;

                const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `รายงานรายวัน_${selectedDate}${demoMode ? '_ตัวอย่าง' : ''}.doc`;
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="space-y-6">
                    <div className="print-header">
                        <h2 className="text-xl font-bold mb-1">รายงานเช็คชื่อรายวัน {settings.CampName}</h2>
                        <p>วันที่ {thaiDate(selectedDate)}{demoMode ? ' (ตัวอย่าง/ข้อมูลจำลอง)' : ''}</p>
                    </div>
                    <div className="flex flex-wrap justify-between items-end gap-3 no-print">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">รายงานเช็คชื่อรายวัน</h2>
                            <div className="flex items-center gap-3 mt-2 flex-wrap">
                                <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm" />
                                <label className="flex items-center gap-2 text-sm text-slate-600">
                                    <input type="checkbox" checked={demoMode} onChange={e => setDemoMode(e.target.checked)} />
                                    ดูตัวอย่างด้วยข้อมูลจำลอง (ยังไม่ต้องมีข้อมูลจริง)
                                </label>
                            </div>
                        </div>
                        <div className="flex gap-2 flex-wrap">
                            <button onClick={exportExcel} className="bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700"><i className="fas fa-file-excel"></i> Excel</button>
                            <button onClick={exportWord} className="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700"><i className="fas fa-file-word"></i> Word</button>
                            <button onClick={() => window.print()} className="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700"><i className="fas fa-print"></i> พิมพ์ / PDF</button>
                        </div>
                    </div>
                    {demoMode && (
                        <div className="bg-amber-50 border border-amber-200 text-amber-800 text-sm p-3 rounded-xl no-print">
                            <i className="fas fa-flask mr-1"></i> กำลังแสดงข้อมูลจำลองเพื่อดูตัวอย่างหน้าตาเอกสารเท่านั้น ไม่ใช่ข้อมูลจริง และจะไม่ถูกบันทึกที่ใด
                        </div>
                    )}

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden print-area daily-report-print">
                        <div className="p-4 border-b border-slate-100 text-sm text-slate-600 flex flex-wrap gap-x-6 gap-y-1">
                            <span>รอบเช้า: มา {summary.amPresent} / ลา {summary.amLeave} / ขาด {summary.amAbsent} คน</span>
                            <span>รอบบ่าย: มา {summary.pmPresent} / ลา {summary.pmLeave} / ขาด {summary.pmAbsent} คน</span>
                            <span>รวมทั้งหมด {roster.length} คน</span>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-100 border-b border-slate-200">
                                    <tr>
                                        <th className="p-3 font-semibold text-slate-700">ที่</th>
                                        <th className="p-3 font-semibold text-slate-700">รหัส</th>
                                        <th className="p-3 font-semibold text-slate-700">ชื่อ-สกุล</th>
                                        <th className="p-3 font-semibold text-slate-700 text-center">รอบเช้า</th>
                                        <th className="p-3 font-semibold text-slate-700 text-center">รอบบ่าย</th>
                                        <th className="p-3 font-semibold text-slate-700">หมายเหตุ / หลักฐานการลา</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {roster.length === 0 ? (
                                        <tr><td colSpan="6" className="p-6 text-center text-slate-500">ยังไม่มีข้อมูลนักเรียน ไปที่แท็บเช็คชื่อเพื่อเพิ่มนักเรียนก่อน</td></tr>
                                    ) : rows.map(r => (
                                        <tr key={r.id} className="compact-row">
                                            <td className="p-3">{r.no}</td>
                                            <td className="p-3 font-mono text-slate-600">{r.id}</td>
                                            <td className="p-3 font-medium text-slate-900">{r.name}</td>
                                            <td className="p-3 text-center">
                                                <span className={`px-2 py-1 rounded text-xs font-bold border ${r.am ? STATUS_META[r.am].cls : 'bg-rose-100 text-rose-700 border-rose-200'}`}>{label(r.am)}</span>
                                            </td>
                                            <td className="p-3 text-center">
                                                <span className={`px-2 py-1 rounded text-xs font-bold border ${r.pm ? STATUS_META[r.pm].cls : 'bg-rose-100 text-rose-700 border-rose-200'}`}>{label(r.pm)}</span>
                                            </td>
                                            <td className="p-3 text-slate-500">{r.leaveDoc || '-'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>

                        <div className="p-8 flex justify-center" style={{ fontSize: '16pt', fontFamily: "'TH SarabunIT๙','TH Sarabun New','Sarabun',sans-serif" }}>
                            <div className="text-center w-full sm:w-1/2">
                                <p>ลงชื่อ..................................................ผู้รับรอง</p>
                                <p className="mt-3">{settings.CertifierName ? `(${settings.CertifierName})` : '(..................................................)'}</p>
                                <p className="mt-3">ตำแหน่ง {settings.CertifierPosition || '..................................................'}</p>
                                <p className="mt-3">วันที่.............เดือน..............................พ.ศ..............</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ============================== SETTINGS TAB ============================== */
        function SettingsTab({ settings, apiUrl, showToast, onRefresh, confirmArm }) {
            const [form, setForm] = useState({
                CampName: settings.CampName, SchoolLat: settings.SchoolLat, SchoolLng: settings.SchoolLng, Radius: settings.Radius,
                AmStart: settings.AmStart, AmEnd: settings.AmEnd, PmStart: settings.PmStart, PmEnd: settings.PmEnd,
                AmHours: settings.AmHours, PmHours: settings.PmHours, EarlyMinutes: settings.EarlyMinutes
            });
            const [certifierName, setCertifierName] = useState(settings.CertifierName || '');
            const [certifierPosition, setCertifierPosition] = useState(settings.CertifierPosition || '');
            const [phases, setPhases] = useState(parsePhases(settings));
            const [locating, setLocating] = useState(false);
            const [currentPin, setCurrentPin] = useState('');
            const [newPin, setNewPin] = useState('');
            const [confirmPin, setConfirmPin] = useState('');
            const [copyLabel, setCopyLabel] = useState('คัดลอกลิงก์');

            const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

            const handleSaveParams = async () => {
                const ok = await apiPost(apiUrl, { action: 'updateSettings', settings: form });
                if (ok) { showToast('✅ บันทึกการตั้งค่าแล้ว', 'success'); onRefresh(); }
                else showToast('⚠️ บันทึกไม่สำเร็จ', 'error');
            };

            const handleSaveCertifier = async () => {
                const ok = await apiPost(apiUrl, { action: 'updateSettings', settings: { CertifierName: certifierName, CertifierPosition: certifierPosition } });
                if (ok) { showToast('✅ บันทึกข้อมูลผู้รับรองแล้ว', 'success'); onRefresh(); }
                else showToast('⚠️️ บันทึกไม่สำเร็จ', 'error');
            };

            const handleUseMyLocation = () => {
                if (!("geolocation" in navigator)) { showToast('❌ อุปกรณ์นี้ไม่รองรับ GPS', 'error'); return; }
                setLocating(true);
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        setForm(f => ({ ...f, SchoolLat: pos.coords.latitude.toFixed(6), SchoolLng: pos.coords.longitude.toFixed(6) }));
                        showToast('📍 ดึงพิกัดปัจจุบันมาใส่แล้ว อย่าลืมกด "บันทึกการตั้งค่า" ด้านล่าง', 'success');
                        setLocating(false);
                    },
                    () => { showToast('❌ ไม่สามารถเข้าถึง GPS ได้ กรุณากด "อนุญาต" การเข้าถึงตำแหน่ง', 'error'); setLocating(false); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const updatePhase = (idx, key, value) => {
                setPhases(prev => prev.map((p, i) => i === idx ? { ...p, [key]: value } : p));
            };
            const addPhase = () => {
                setPhases(prev => [...prev, { id: 'p' + (Date.now()), name: `ช่วงที่ ${prev.length + 1}`, start: todayKey(), end: todayKey(), minPercent: 80 }]);
            };
            const removePhase = (idx) => setPhases(prev => prev.filter((_, i) => i !== idx));
            const handleSavePhases = async () => {
                const ok = await apiPost(apiUrl, { action: 'updateSettings', settings: { Phases: JSON.stringify(phases) } });
                if (ok) { showToast('✅ บันทึกช่วงเวลาการเข้าค่ายแล้ว', 'success'); onRefresh(); }
                else showToast('⚠️ บันทึกไม่สำเร็จ', 'error');
            };

            const handleChangePin = async () => {
                if (currentPin !== String(settings.TeacherPin)) { showToast('❌ รหัสผ่านปัจจุบันไม่ถูกต้อง', 'error'); return; }
                if (!newPin || newPin.length < 4) { showToast('⚠️ รหัสผ่านใหม่ควรมีอย่างน้อย 4 หลัก', 'error'); return; }
                if (newPin !== confirmPin) { showToast('⚠️ รหัสผ่านใหม่ไม่ตรงกัน', 'error'); return; }
                const ok = await apiPost(apiUrl, { action: 'updateSettings', settings: { TeacherPin: newPin } });
                if (ok) { showToast('✅ เปลี่ยนรหัสผ่านแล้ว', 'success'); setCurrentPin(''); setNewPin(''); setConfirmPin(''); onRefresh(); }
                else showToast('⚠️ เปลี่ยนรหัสผ่านไม่สำเร็จ', 'error');
            };

            const shareLink = `${window.location.origin}${window.location.pathname}?api=${encodeURIComponent(apiUrl)}`;
            const copyLink = () => {
                navigator.clipboard.writeText(shareLink).then(() => {
                    setCopyLabel('คัดลอกแล้ว ✓');
                    setTimeout(() => setCopyLabel('คัดลอกลิงก์'), 2000);
                });
            };

            return (
                <div className="max-w-2xl space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-2"><i className="fas fa-share-alt text-emerald-600 mr-2"></i>ลิงก์สำหรับแจกนักเรียน</h2>
                        <p className="text-sm text-slate-500 mb-3">แจกลิงก์นี้ให้นักเรียน ทุกคนจะเชื่อมกับฐานข้อมูลเดียวกันโดยอัตโนมัติ ไม่ต้องตั้งค่าเอง</p>
                        <div className="flex gap-2">
                            <input readOnly value={shareLink} className="flex-1 p-2 border border-slate-300 rounded bg-slate-50 text-xs font-mono" onFocus={e => e.target.select()} />
                            <button onClick={copyLink} className="bg-emerald-600 text-white px-4 rounded-lg text-sm font-medium whitespace-nowrap">{copyLabel}</button>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-4"><i className="fas fa-calendar-week text-indigo-600 mr-2"></i>ช่วงเวลาการเข้าค่ายและเกณฑ์แต่ละช่วง</h2>
                        <p className="text-sm text-slate-500 mb-4">แต่ละช่วงมีวันเริ่ม-สิ้นสุด และเกณฑ์ขั้นต่ำ (%) เป็นของตัวเอง เช่น ช่วงแรกต้องมา 80% ช่วงหลังต้องมา 100%</p>
                        <p className="text-sm text-indigo-600 bg-indigo-50 border border-indigo-100 p-3 rounded-lg mb-4">
                            <i className="fas fa-layer-group mr-1"></i> ถ้าอยากรวมชั่วโมง/เกณฑ์ของหลายช่วงเข้าเป็นก้อนเดียว (เช่น บรรยายที่ถูกแบ่งเป็น 2 ช่วงเพราะน้ำท่วม) ให้ตั้ง "ชื่อกลุ่ม" เหมือนกันในช่องด้านล่าง — ระบบจะรวมชั่วโมงของช่วงที่ชื่อกลุ่มตรงกันมาคิดเปอร์เซ็นต์เดียว โดยใช้เกณฑ์ % ของช่วงแรกในกลุ่มนั้น ปล่อยว่างไว้หากต้องการให้แยกอิสระตามปกติ
                        </p>
                        <div className="space-y-3">
                            {phases.map((ph, idx) => (
                                <div key={ph.id} className="border border-slate-200 rounded-xl p-4 space-y-2">
                                    <div className="flex items-center gap-2">
                                        <input type="text" value={ph.name} onChange={e => updatePhase(idx, 'name', e.target.value)} placeholder="ชื่อช่วง เช่น ช่วงที่ 1" className="flex-1 p-2 border border-slate-300 rounded text-sm font-medium" />
                                        <button onClick={() => removePhase(idx)} className="text-rose-500 hover:bg-rose-50 w-9 h-9 rounded-lg flex items-center justify-center"><i className="fas fa-trash"></i></button>
                                    </div>
                                    <div>
                                        <label className="block text-[11px] text-slate-400 mb-1">ชื่อกลุ่ม (ไม่บังคับ — ใส่เหมือนกันเพื่อรวมกับช่วงอื่น)</label>
                                        <input type="text" value={ph.group || ''} onChange={e => updatePhase(idx, 'group', e.target.value)} placeholder="เช่น บรรยาย" className="w-full p-2 border border-slate-300 rounded text-sm" />
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="block text-[11px] text-slate-400 mb-1">วันเริ่ม</label>
                                            <input type="date" value={ph.start} onChange={e => updatePhase(idx, 'start', e.target.value)} className="w-full p-2 border border-slate-300 rounded text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-slate-400 mb-1">วันสิ้นสุด</label>
                                            <input type="date" value={ph.end} onChange={e => updatePhase(idx, 'end', e.target.value)} className="w-full p-2 border border-slate-300 rounded text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-slate-400 mb-1">เกณฑ์ขั้นต่ำ (%)</label>
                                            <input type="number" min="0" max="100" value={ph.minPercent} onChange={e => updatePhase(idx, 'minPercent', Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded text-sm" />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <button onClick={addPhase} className="w-full mt-3 border-2 border-dashed border-slate-300 text-slate-500 p-2.5 rounded-xl text-sm font-medium hover:bg-slate-50">
                            <i className="fas fa-plus mr-1"></i> เพิ่มช่วงเวลา
                        </button>
                        <button onClick={handleSavePhases} className="w-full bg-indigo-600 text-white p-3 rounded-lg font-medium mt-4">บันทึกช่วงเวลาการเข้าค่าย</button>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-4"><i className="fas fa-sliders-h text-blue-600 mr-2"></i>ตั้งค่าค่ายและเงื่อนไขการเช็คชื่อ</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div className="sm:col-span-2">
                                <label className="block text-xs font-bold text-slate-500 mb-1">ชื่อค่าย</label>
                                <input type="text" value={form.CampName} onChange={set('CampName')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            </div>
                            <div className="sm:col-span-2">
                                <button onClick={handleUseMyLocation} disabled={locating} className="w-full bg-blue-50 text-blue-700 border border-blue-200 p-2.5 rounded-lg text-sm font-medium disabled:opacity-50">
                                    <i className={`fas ${locating ? 'fa-spinner fa-spin' : 'fa-location-crosshairs'} mr-1`}></i> {locating ? 'กำลังดึงตำแหน่ง...' : 'ใช้ตำแหน่งปัจจุบันของฉัน (ต้องยืนอยู่ที่โรงเรียน)'}
                                </button>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">ละติจูดโรงเรียน</label>
                                <input type="number" step="any" value={form.SchoolLat} onChange={set('SchoolLat')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">ลองจิจูดโรงเรียน</label>
                                <input type="number" step="any" value={form.SchoolLng} onChange={set('SchoolLng')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">รัศมีที่เช็คชื่อได้ (เมตร)</label>
                                <input type="number" value={form.Radius} onChange={set('Radius')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">เปิดให้เช็คชื่อล่วงหน้าก่อนเวลาเริ่ม (นาที)</label>
                                <input type="number" min="0" step="5" value={form.EarlyMinutes} onChange={set('EarlyMinutes')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">เวลาเริ่ม-สิ้นสุด รอบเช้า</label>
                                <div className="flex gap-2">
                                    <input type="time" value={form.AmStart} onChange={set('AmStart')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                                    <input type="time" value={form.AmEnd} onChange={set('AmEnd')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">เวลาเริ่ม-สิ้นสุด รอบบ่าย</label>
                                <div className="flex gap-2">
                                    <input type="time" value={form.PmStart} onChange={set('PmStart')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                                    <input type="time" value={form.PmEnd} onChange={set('PmEnd')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">ชั่วโมง/รอบเช้า</label>
                                <input type="number" step="0.5" value={form.AmHours} onChange={set('AmHours')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">ชั่วโมง/รอบบ่าย</label>
                                <input type="number" step="0.5" value={form.PmHours} onChange={set('PmHours')} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            </div>
                        </div>
                        <button onClick={handleSaveParams} className="w-full bg-slate-900 text-white p-3 rounded-lg font-medium mt-5">บันทึกการตั้งค่า</button>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-2"><i className="fas fa-signature text-emerald-600 mr-2"></i>ผู้รับรองเอกสาร</h2>
                        <p className="text-sm text-slate-500 mb-4">กรอกไว้ครั้งเดียว ระบบจะพิมพ์ชื่อและตำแหน่งนี้ลงในเอกสารรายงานรายวันให้อัตโนมัติทุกครั้ง (ไม่ต้องพิมพ์ใหม่) เหลือแต่ลงลายมือชื่อจริงด้วยปากกาเท่านั้น</p>
                        <div className="space-y-3">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">ชื่อ-สกุลผู้รับรอง</label>
                                <input type="text" value={certifierName} onChange={e => setCertifierName(e.target.value)} placeholder="เช่น นายสมชาย ใจดี" className="w-full p-2 border border-slate-300 rounded text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">ตำแหน่ง</label>
                                <input type="text" value={certifierPosition} onChange={e => setCertifierPosition(e.target.value)} placeholder="เช่น ผู้อำนวยการโรงเรียน" className="w-full p-2 border border-slate-300 rounded text-sm" />
                            </div>
                            <button onClick={handleSaveCertifier} className="w-full bg-emerald-600 text-white p-3 rounded-lg font-medium">บันทึกข้อมูลผู้รับรอง</button>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-4"><i className="fas fa-key text-amber-600 mr-2"></i>เปลี่ยนรหัสผ่านครู/ผู้ดูแล</h2>
                        <div className="space-y-3">
                            <input type="password" placeholder="รหัสผ่านปัจจุบัน" value={currentPin} onChange={e => setCurrentPin(e.target.value)} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            <input type="password" placeholder="รหัสผ่านใหม่" value={newPin} onChange={e => setNewPin(e.target.value)} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            <input type="password" placeholder="ยืนยันรหัสผ่านใหม่" value={confirmPin} onChange={e => setConfirmPin(e.target.value)} className="w-full p-2 border border-slate-300 rounded text-sm" />
                            <button onClick={handleChangePin} className="w-full bg-amber-600 text-white p-3 rounded-lg font-medium">เปลี่ยนรหัสผ่าน</button>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-2"><i className="fas fa-table text-slate-600 mr-2"></i>ข้อมูลดิบทั้งหมด</h2>
                        <p className="text-sm text-slate-500">ข้อมูลนักเรียน การเช็คชื่อ และการตั้งค่าทั้งหมด เก็บอยู่ใน Google Sheet ที่ผูกกับสคริปต์นี้โดยตรง เปิดชีตดู/สำรองข้อมูลได้ตลอดเวลาจาก Google Drive ของคุณครู</p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
