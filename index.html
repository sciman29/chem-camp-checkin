<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็คชื่อเข้าเรียน สอวน. เคมี</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        @media print {
            @page { size: A4; margin: 12mm 10mm; }
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            .print-header { display: block !important; text-align: center; margin-bottom: 16px; }
            .print-only { display: block !important; }
            .screen-only-table { display: none !important; }
            .daily-report-print, .daily-report-print table, .daily-report-print th, .daily-report-print td {
                font-family: 'TH SarabunIT๙','TH Sarabun New','Sarabun',sans-serif !important;
                font-size: 16pt !important;
            }
        }
        .print-header { display: none; }
        .print-only { display: none; }
        .compact-row { break-inside: avoid; page-break-inside: avoid; }
        .seg-btn { transition: all .15s ease; }
        .toast-enter { animation: toastIn .2s ease-out; }
        @keyframes toastIn { from { opacity:0; transform: translateY(-8px);} to { opacity:1; transform: translateY(0);} }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        /* ============================== API LAYER ============================== */
        const urlParams = new URLSearchParams(window.location.search);
        const getStoredApiUrl = () => { try { return localStorage.getItem('posn_api_url') || ''; } catch (e) { return ''; } };
        const setStoredApiUrl = (u) => { try { localStorage.setItem('posn_api_url', u); } catch (e) {} };
        const getCache = () => { try { const c = localStorage.getItem('posn_cache'); return c ? JSON.parse(c) : null; } catch (e) { return null; } };
        const setCache = (d) => { try { localStorage.setItem('posn_cache', JSON.stringify(d)); } catch (e) {} };

        // ผูก URL ของ Apps Script ไว้ตายตัว นักเรียนเปิดลิงก์นี้แล้วใช้งานได้ทันที ไม่ต้องตั้งค่าเอง
        const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxjK6Ks8iN5r2JU6kE5Z_0bwTmhLU3zqrGRI6_Za_SVZmQUcrAGYAwMJsKcDDtTfHbXTA/exec';
        const INITIAL_API_URL = urlParams.get('api') || getStoredApiUrl() || DEFAULT_API_URL;
        if (urlParams.get('api')) setStoredApiUrl(urlParams.get('api'));

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        async function apiGet(apiUrl) {
            const sep = apiUrl.includes('?') ? '&' : '?';
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const res = await fetch(apiUrl + sep + 't=' + Date.now(), { cache: 'no-store' });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (!data.ok) throw new Error(data.error || 'response not ok');
                    setCache(data);
                    return { data, fromCache: false };
                } catch (e) {
                    if (attempt === 2) {
                        const cached = getCache();
                        if (cached) return { data: cached, fromCache: true };
                        throw e;
                    }
                    await sleep(700 * (attempt + 1));
                }
            }
        }

        async function apiPost(apiUrl, payload) {
            for (let attempt = 0; attempt < 3; attempt++) {
                try {
                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (!data.ok) throw new Error(data.error || 'failed');
                    return true;
                } catch (e) {
                    if (attempt === 2) return false;
                    await sleep(700 * (attempt + 1));
                }
            }
        }

        /* ============================== HELPERS ============================== */
        const pad2 = n => String(n).padStart(2, '0');
        const toDateKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        const todayKey = () => toDateKey(new Date());
        const thaiDate = (dateKey) => {
            const d = new Date(dateKey + 'T00:00:00');
            return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        };
        const timeToDec = (str) => { const [h, m] = String(str).split(':').map(Number); return h + (m || 0) / 60; };

        // เวลาแบบไทย (Asia/Bangkok) จาก timestamp ที่เซิร์ฟเวอร์บันทึกไว้ (ไม่ขึ้นกับนาฬิกาเครื่องนักเรียน)
        const bkkTime = (ts) => {
            const d = new Date(ts);
            if (isNaN(d.getTime())) return null;
            const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d);
            const h = Number(parts.find(p => p.type === 'hour').value) % 24;
            const m = Number(parts.find(p => p.type === 'minute').value);
            return { h, m, dec: h + m / 60, str: String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') };
        };

        // เรียงรายชื่อตามเลขที่ (ตัวเลข) ก่อน ถ้าไม่มีเลขที่ให้เรียงตามชื่อ
        const sortRoster = (list) => [...list].sort((a, b) => {
            const na = parseInt(a.no, 10), nb = parseInt(b.no, 10);
            const ha = !isNaN(na), hb = !isNaN(nb);
            if (ha && hb && na !== nb) return na - nb;
            if (ha !== hb) return ha ? -1 : 1;
            return String(a.name).localeCompare(String(b.name), 'th');
        });

        // ขอตำแหน่ง GPS แบบทนทานขึ้น: ลองความแม่นยำสูงก่อน ถ้าหมดเวลา/หาสัญญาณไม่ได้ ลองใหม่แบบประหยัด (Wi-Fi/เสาสัญญาณ) รอนานขึ้น
        const getPositionRobust = () => new Promise((resolve, reject) => {
            if (!('geolocation' in navigator)) { reject({ code: 0 }); return; }
            navigator.geolocation.getCurrentPosition(resolve, (err1) => {
                if (err1.code === 1) { reject(err1); return; }
                navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: false, timeout: 25000, maximumAge: 60000 });
            }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
        });

        const isInAppBrowser = () => /Line\/|FBAN|FBAV|Instagram|MicroMessenger|Messenger/i.test(navigator.userAgent || '');

        const geoErrorMessage = (err) => {
            const inApp = isInAppBrowser() ? ' (ตรวจพบว่าเปิดจากในแอป LINE/Facebook — กรุณากดเมนู "เปิดในเบราว์เซอร์" แล้วเปิดด้วย Chrome หรือ Safari แทน)' : '';
            if (err && err.code === 0) return '❌ อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับ GPS กรุณาเปิดด้วย Chrome หรือ Safari' + inApp;
            if (err && err.code === 1) return '❌ เบราว์เซอร์ยังไม่ได้รับอนุญาตให้ใช้ตำแหน่ง — ตรวจสอบ 2 จุด: (1) ตั้งค่ามือถือ > ตำแหน่ง/Location Services เปิดอยู่ และอนุญาตให้ Chrome/Safari เข้าถึงตำแหน่ง (2) ในเบราว์เซอร์ กดไอคอนแม่กุญแจข้างชื่อเว็บ > สิทธิ์ > ตำแหน่ง > อนุญาต แล้วรีเฟรชหน้านี้' + inApp;
            if (err && err.code === 2) return '❌ มือถือหาตำแหน่งไม่เจอ ลองเดินไปใกล้หน้าต่าง/กลางแจ้ง เปิด Wi-Fi และโหมดตำแหน่งแบบความแม่นยำสูง แล้วกดใหม่' + inApp;
            return '❌ หาตำแหน่งไม่ทันเวลา (สัญญาณ GPS อ่อน) ลองกดอีกครั้ง หรือเดินไปที่โล่ง/ใกล้หน้าต่าง ถ้ายังไม่ได้ให้แจ้งครูเพื่อเช็คชื่อแทน' + inApp;
        };

        // กันพัง: ถ้า Google Sheets แอบแปลงค่าเวลากลับมาเพี้ยน (เช่นได้ ISO date string แทน "08:30")
        // ให้ใช้ค่าปกติแทนไปก่อน แทนที่จะโชว์ข้อความแปลกๆ ให้ผู้ใช้เห็น
        const SAFE_DEFAULT_SETTINGS = { AmStart: '08:30', AmEnd: '12:00', PmStart: '12:30', PmEnd: '16:00' };
        const TIME_RE = /^([01]\d|2[0-3]):([0-5]\d)$/;
        const sanitizeSettings = (raw) => {
            const s = { ...raw };
            ['AmStart', 'AmEnd', 'PmStart', 'PmEnd'].forEach(k => {
                if (!TIME_RE.test(String(s[k]))) s[k] = SAFE_DEFAULT_SETTINGS[k];
            });
            if (isNaN(Number(s.SchoolLat))) s.SchoolLat = '13.8176';
            if (isNaN(Number(s.SchoolLng))) s.SchoolLng = '100.5613';
            if (isNaN(Number(s.Radius)) || Number(s.Radius) <= 0) s.Radius = '500';
            if (isNaN(Number(s.AmHours)) || Number(s.AmHours) <= 0) s.AmHours = '2.5';
            if (isNaN(Number(s.PmHours)) || Number(s.PmHours) <= 0) s.PmHours = '3';
            if (isNaN(Number(s.EarlyMinutes))) s.EarlyMinutes = '60';
            if (s.LateMinutes === undefined || s.LateMinutes === '' || isNaN(Number(s.LateMinutes))) s.LateMinutes = '15';
            return s;
        };

        const getDistance = (lat1, lon1, lat2, lon2) => {
            const R = 6371e3;
            const p1 = lat1 * Math.PI / 180, p2 = lat2 * Math.PI / 180;
            const dp = (lat2 - lat1) * Math.PI / 180, dl = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        };

        // Fold the append-only attendance log into "current status per date/student/session"
        // (latest timestamp wins, so edits/overrides always take effect)
        function foldAttendance(log) {
            const map = {};
            const sorted = [...log].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            sorted.forEach(entry => {
                const { date, studentId, session } = entry;
                if (!map[date]) map[date] = {};
                if (!map[date][studentId]) map[date][studentId] = {};
                map[date][studentId][session] = entry.status;
                map[date][studentId][session + 'Method'] = entry.method;
                map[date][studentId][session + 'Time'] = entry.timestamp;
                if (entry.leaveDoc) map[date][studentId].leaveDoc = entry.leaveDoc;
            });
            return map;
        }

        const parsePhases = (settings) => {
            try { const p = JSON.parse(settings.Phases || '[]'); return Array.isArray(p) ? p : []; } catch (e) { return []; }
        };

        const dateRange = (start, end) => {
            const dates = [];
            let d = new Date(start + 'T00:00:00');
            const endD = new Date(end + 'T00:00:00');
            let guard = 0;
            while (d <= endD && guard < 400) { dates.push(toDateKey(d)); d.setDate(d.getDate() + 1); guard++; }
            return dates;
        };

        // สรุปผลของนักเรียน 1 คน ในช่วง (phase) เดียว: จำนวนครั้งที่มา/ขาด/ลา และร้อยละเทียบกับช่วงทั้งหมด
        const computePhaseStats = (studentId, phase, attendanceMap, settings) => {
            const dates = dateRange(phase.start, phase.end);
            const today = todayKey();
            
            // เพิ่มการดึงเวลาปัจจุบัน เพื่อไม่ให้รอบที่ยังไม่จบถูกด่วนสรุปว่า "ขาด"
            const now = new Date();
            const nowDec = now.getHours() + now.getMinutes() / 60;
            const amEnd = timeToDec(settings.AmEnd);
            const pmEnd = timeToDec(settings.PmEnd);
            
            const amH = Number(settings.AmHours), pmH = Number(settings.PmHours);
            let present = 0, absent = 0, leave = 0, attendedHours = 0, remainingHours = 0;
            const totalHours = dates.length * (amH + pmH);
            
            dates.forEach(date => {
                const rec = (attendanceMap[date] && attendanceMap[date][studentId]) || {};
                if (rec.am === 'present') attendedHours += amH;
                if (rec.pm === 'present') attendedHours += pmH;
                
                if (date < today) {
                    // วันที่ผ่านไปแล้ว: ถ้าช่องว่าง ถือว่าขาด
                    ['am', 'pm'].forEach(sess => {
                        const st = rec[sess] || 'absent';
                        if (st === 'present') present++;
                        else if (st === 'leave') leave++;
                        else absent++;
                    });
                } else if (date === today) {
                    // วันนี้: เช็คก่อนว่าหมดเวลารอบนั้นหรือยัง
                    ['am', 'pm'].forEach(sess => {
                        const st = rec[sess];
                        const end = sess === 'am' ? amEnd : pmEnd;
                        
                        if (st === 'present') present++;
                        else if (st === 'leave') leave++;
                        else if (st === 'absent') absent++;
                        else {
                            // หากช่องยังว่าง และเลยกำหนดเวลาเช็คชื่อของรอบนั้นไปแล้ว ถึงจะนับว่าขาด
                            if (nowDec > end) absent++;
                            else remainingHours += (sess === 'am' ? amH : pmH);
                        }
                    });
                } else {
                    // วันที่ยังไม่มาถึง ยังมีโอกาสมาเรียนเพิ่มได้อีก
                    remainingHours += amH + pmH;
                }
            });
            const percent = totalHours ? (attendedHours / totalHours * 100) : 0;
            // "เสี่ยง" จริง ก็ต่อเมื่อต่อให้มาเรียนครบทุกวันที่เหลือ ก็ยังไม่ถึงเกณฑ์ที่กำหนด
            const maxPossiblePercent = totalHours ? ((attendedHours + remainingHours) / totalHours * 100) : 0;
            const isAtRisk = maxPossiblePercent < Number(phase.minPercent);
            return { present, absent, leave, attendedHours, totalHours, remainingHours, percent, isAtRisk };
        };

        // จัดกลุ่มช่วงเวลา: ช่วงที่ตั้ง "group" เดียวกัน จะถูกรวมชั่วโมง/เกณฑ์เข้าด้วยกันเป็นก้อนเดียว
        // ช่วงที่ไม่ได้ตั้ง group จะแยกเป็นอิสระของตัวเอง (พฤติกรรมเดิม)
        const groupPhases = (phases) => {
            const map = {}; const order = [];
            phases.forEach(ph => {
                const key = (ph.group && ph.group.trim()) ? ph.group.trim() : ('__solo__' + ph.id);
                if (!map[key]) {
                    map[key] = { key, name: (ph.group && ph.group.trim()) ? ph.group.trim() : ph.name, minPercent: ph.minPercent, phases: [] };
                    order.push(key);
                }
                map[key].phases.push(ph);
            });
            return order.map(k => map[k]);
        };

        // สรุปผลของนักเรียน 1 คน รวมทุกช่วงในกลุ่มเดียวกันเข้าด้วยกัน (ใช้ minPercent ของช่วงแรกในกลุ่มเป็นเกณฑ์)
        const computeGroupStats = (studentId, group, attendanceMap, settings) => {
            let present = 0, absent = 0, leave = 0, attendedHours = 0, totalHours = 0, remainingHours = 0;
            group.phases.forEach(ph => {
                const s = computePhaseStats(studentId, ph, attendanceMap, settings);
                present += s.present; absent += s.absent; leave += s.leave;
                attendedHours += s.attendedHours; totalHours += s.totalHours; remainingHours += s.remainingHours;
            });
            const percent = totalHours ? (attendedHours / totalHours * 100) : 0;
            const maxPossiblePercent = totalHours ? ((attendedHours + remainingHours) / totalHours * 100) : 0;
            const isAtRisk = maxPossiblePercent < Number(group.minPercent);
            return { present, absent, leave, attendedHours, totalHours, percent, isAtRisk };
        };

        const computeOverallStats = (studentId, phases, attendanceMap, settings) => {
            let attendedHours = 0, totalHours = 0, present = 0, absent = 0, leave = 0;
            phases.forEach(ph => {
                const s = computePhaseStats(studentId, ph, attendanceMap, settings);
                attendedHours += s.attendedHours; totalHours += s.totalHours;
                present += s.present; absent += s.absent; leave += s.leave;
            });
            const percent = totalHours ? (attendedHours / totalHours * 100) : 0;
            return { present, absent, leave, attendedHours, totalHours, percent };
        };

        const STATUS_META = {
            present: { label: 'มา', short: 'ม', cls: 'bg-emerald-100 text-emerald-700 border-emerald-200' },
            leave: { label: 'ลา', short: 'ล', cls: 'bg-amber-100 text-amber-700 border-amber-200' },
            absent: { label: 'ขาด', short: 'ข', cls: 'bg-rose-100 text-rose-700 border-rose-200' }
        };

        /* ============================== SMALL UI PRIMITIVES ============================== */
        function Toast({ toast }) {
            if (!toast) return null;
            const cls = toast.type === 'error' ? 'bg-rose-600' : toast.type === 'success' ? 'bg-emerald-600' : 'bg-slate-800';
            return (
                <div className={`toast-enter fixed top-4 left-1/2 -translate-x-1/2 z-[100] ${cls} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium max-w-[92vw] text-center no-print`}>
                    {toast.text}
                </div>
            );
        }

        function useConfirmArm() {
            const [armedKey, setArmedKey] = useState(null);
            const timerRef = useRef(null);
            const arm = (key) => { setArmedKey(key); clearTimeout(timerRef.current); timerRef.current = setTimeout(() => setArmedKey(null), 3000); };
            const isArmed = (key) => armedKey === key;
            const reset = () => { setArmedKey(null); clearTimeout(timerRef.current); };
            return { arm, isArmed, reset };
        }

        function SegmentedStatus({ value, onChange, disabled }) {
            return (
                <div className="inline-flex rounded-lg border border-slate-200 overflow-hidden">
                    {['present', 'leave', 'absent'].map(s => (
                        <button key={s} disabled={disabled} onClick={() => onChange(s)}
                            className={`seg-btn px-2.5 py-1.5 text-xs font-bold ${value === s
                                ? (s === 'present' ? 'bg-emerald-600 text-white' : s === 'leave' ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white')
                                : 'bg-white text-slate-400 hover:bg-slate-50'} ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}>
                            {STATUS_META[s].short}
                        </button>
                    ))}
                    {value && (
                        <button disabled={disabled} onClick={() => onChange('')} title="ล้างสถานะ (กดผิด/ยกเลิกการเลือก)"
                            className={`seg-btn px-2 py-1.5 text-xs bg-white text-slate-400 hover:bg-slate-100 hover:text-slate-600 border-l border-slate-200 ${disabled ? 'opacity-50 cursor-not-allowed' : ''}`}>
                            <i className="fas fa-eraser"></i>
                        </button>
                    )}
                </div>
            );
        }

        /* ============================== CONNECT SCREEN (first run) ============================== */
        function ConnectScreen({ onConnected }) {
            const [value, setValue] = useState('');
            const [testing, setTesting] = useState(false);
            const [error, setError] = useState('');

            const handleConnect = async () => {
                const url = value.trim();
                if (!url.startsWith('https://script.google.com/')) {
                    setError('⚠️ ลิงก์ควรขึ้นต้นด้วย https://script.google.com/ และลงท้ายด้วย /exec');
                    return;
                }
                setTesting(true); setError('');
                try {
                    const { data } = await apiGet(url);
                    if (!data || !data.settings) throw new Error('bad response');
                    setStoredApiUrl(url);
                    onConnected(url);
                } catch (e) {
                    setError('❌ เชื่อมต่อไม่สำเร็จ ตรวจสอบว่า Deploy เป็น Web app แบบ "Anyone" แล้ว');
                }
                setTesting(false);
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
                        <div className="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-600">
                            <i className="fas fa-plug text-2xl"></i>
                        </div>
                        <h2 className="text-xl font-bold text-slate-800 mb-2 text-center">ตั้งค่าการเชื่อมต่อครั้งแรก</h2>

        /* ============================== APP ============================== */
        function App() {
            const [apiUrl, setApiUrl] = useState(INITIAL_API_URL);
            const [booted, setBooted] = useState(false);
            const [role, setRole] = useState('select');
            const [settings, setSettings] = useState(null);
            const [rawSettings, setRawSettings] = useState(null);
            const [roster, setRoster] = useState([]);
            const [attendanceLog, setAttendanceLog] = useState([]);
            const [currentStudentId, setCurrentStudentId] = useState('');
            const [inputValue, setInputValue] = useState('');
            const [loginError, setLoginError] = useState('');
            const [toast, setToast] = useState(null);
            const [refreshing, setRefreshing] = useState(false);
            const [usingCache, setUsingCache] = useState(false);

            const showToast = (text, type = 'info') => {
                setToast({ text, type });
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => setToast(null), 3200);
            };

            const attendanceMap = useMemo(() => foldAttendance(attendanceLog), [attendanceLog]);

            const load = async (silent) => {
                if (!apiUrl) return;
                if (!silent) setRefreshing(true);
                try {
                    const { data, fromCache } = await apiGet(apiUrl);
                    setSettings(sanitizeSettings(data.settings));
                    setRawSettings(data.settings);
                    setRoster(sortRoster(data.students || []));
                    setAttendanceLog(data.attendance || []);
                    setUsingCache(fromCache);
                    if (fromCache && !silent) showToast('⚠️ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กำลังแสดงข้อมูลสำรองล่าสุดในเครื่อง', 'error');
                    else if (!silent) showToast('✅ อัปเดตข้อมูลล่าสุดแล้ว', 'success');
                } catch (e) {
                    if (!silent) showToast('⚠️ โหลดข้อมูลไม่สำเร็จ และไม่มีข้อมูลสำรองในเครื่องนี้', 'error');
                }
                if (!silent) setRefreshing(false);
                setBooted(true);
            };

            useEffect(() => { load(true); }, [apiUrl]);
            useEffect(() => {
                if (role !== 'teacher' && role !== 'student') return;
                const id = setInterval(() => load(true), 25000);
                return () => clearInterval(id);
            }, [role, apiUrl]);

            if (!apiUrl) {
                return <ConnectScreen onConnected={(u) => { setApiUrl(u); }} />;
            }
            if (!booted) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50">
                        <div className="text-center text-slate-400">
                            <i className="fas fa-flask text-3xl mb-3 animate-pulse"></i>
                            <p>กำลังโหลดระบบ...</p>
                        </div>
                    </div>
                );
            }

            const logout = () => { setRole('select'); setInputValue(''); setLoginError(''); setCurrentStudentId(''); };

            const handleStudentLogin = () => {
                if (!inputValue.trim()) { setLoginError('กรุณากรอกรหัสประจำตัว'); return; }
                if (roster.length === 0) { setLoginError('❌ ยังไม่มีรายชื่อนักเรียนในระบบ กรุณาแจ้งครูผู้สอน'); return; }
                const searchId = String(inputValue).trim().toUpperCase();
                const found = roster.find(s => String(s.id).trim().toUpperCase() === searchId);
                if (found) { setCurrentStudentId(found.id); setRole('student'); setLoginError(''); setInputValue(''); }
                else setLoginError(`❌ ไม่พบรหัส "${searchId}" ในระบบ`);
            };

            const handleTeacherLogin = () => {
                if (inputValue === String(settings.TeacherPin)) { setRole('teacher'); setLoginError(''); setInputValue(''); }
                else setLoginError('❌ รหัสผ่านไม่ถูกต้อง');
            };

            return (
                <React.Fragment>
                    <Toast toast={toast} />
                    {usingCache && (role === 'teacher' || role === 'student') && (
                        <div className="bg-amber-500 text-white text-xs text-center py-1.5 no-print">
                            ⚠️ ออฟไลน์ชั่วคราว — กำลังแสดงข้อมูลสำรองล่าสุด การเช็คชื่อจะบันทึกเมื่อเชื่อมต่อได้อีกครั้ง
                        </div>
                    )}
                    {role === 'select' && <RoleSelectScreen settings={settings} onPick={(r) => { setRole(r); setLoginError(''); setInputValue(''); }} />}
                    {role === 'login_student' && (
                        <StudentLoginScreen inputValue={inputValue} setInputValue={setInputValue} loginError={loginError}
                            onBack={() => setRole('select')} onSubmit={handleStudentLogin} />
                    )}
                    {role === 'login_teacher' && (
                        <TeacherLoginScreen inputValue={inputValue} setInputValue={setInputValue} loginError={loginError}
                            onBack={() => setRole('select')} onSubmit={handleTeacherLogin} />
                    )}
                    {role === 'student' && (
                        <StudentView studentId={currentStudentId} roster={roster} settings={settings} attendanceMap={attendanceMap}
                            apiUrl={apiUrl} onLogout={logout} onRefresh={() => load(false)} refreshing={refreshing} showToast={showToast} />
                    )}
                    {role === 'teacher' && (
                        <TeacherView roster={roster} settings={settings} rawSettings={rawSettings} attendanceMap={attendanceMap} apiUrl={apiUrl}
                            onLogout={logout} onRefresh={() => load(false)} refreshing={refreshing} showToast={showToast} />
                    )}

            );
        }

                                <div>

                                <div>
                                    <p className="font-bold text-slate-800">ถ้าลืมเช็คชื่อหรือมีเหตุจำเป็นต้องลา</p>

        /* ============================== STUDENT VIEW ============================== */
        function StudentView({ studentId, roster, settings, attendanceMap, apiUrl, onLogout, onRefresh, refreshing, showToast }) {
            const me = roster.find(s => String(s.id) === String(studentId));
            const [isCheckingIn, setIsCheckingIn] = useState(false);
            const [checkInMessage, setCheckInMessage] = useState(null);

            if (!me) return <div className="p-6 text-center">ไม่พบข้อมูลของคุณ</div>;

            const today = todayKey();
            const todayRec = (attendanceMap[today] && attendanceMap[today][me.id]) || {};
            const phases = parsePhases(settings);
            const groups = groupPhases(phases);
            const phaseStats = groups.map(g => ({ phase: g, stats: computeGroupStats(me.id, g, attendanceMap, settings) }));
            const overall = computeOverallStats(me.id, phases, attendanceMap, settings);

            const withinWindow = (session) => {
                const now = new Date();
                const t = now.getHours() + now.getMinutes() / 60;
                const early = Number(settings.EarlyMinutes || 0) / 60;
                const startDec = session === 'am' ? timeToDec(settings.AmStart) : timeToDec(settings.PmStart);
                const endDec = session === 'am' ? timeToDec(settings.AmEnd) : timeToDec(settings.PmEnd);
                return t >= (startDec - early) && t <= endDec;
            };

            const decToTime = (dec) => { const h = Math.floor(((dec % 24) + 24) % 24); const m = Math.round((dec - Math.floor(dec)) * 60); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; };

            const handleCheckIn = (session) => {
                if (!withinWindow(session)) {
                    const early = Number(settings.EarlyMinutes || 0) / 60;
                    const openDec = (session === 'am' ? timeToDec(settings.AmStart) : timeToDec(settings.PmStart)) - early;
                    const closeStr = session === 'am' ? settings.AmEnd : settings.PmEnd;
                    setCheckInMessage({ text: `❌ ขณะนี้ไม่อยู่ในช่วงเวลาเช็คชื่อรอบ${session === 'am' ? 'เช้า' : 'บ่าย'} (${decToTime(openDec)} - ${closeStr} น.)`, type: 'error' });
                    return;
                }
                setIsCheckingIn(true);
                setCheckInMessage({ text: 'กำลังดึงตำแหน่งพิกัด GPS ของคุณ...', type: 'loading' });

                const process = async (lat, lng) => {
                    const distance = getDistance(lat, lng, Number(settings.SchoolLat), Number(settings.SchoolLng));
                    if (distance <= Number(settings.Radius)) {
                        setCheckInMessage({ text: 'กำลังบันทึกข้อมูล...', type: 'loading' });
                        const ok = await apiPost(apiUrl, { action: 'checkin', date: today, studentId: me.id, session, status: 'present', method: 'gps' });
                        if (ok) { setCheckInMessage({ text: `✅ เช็คชื่อรอบ${session === 'am' ? 'เช้า' : 'บ่าย'} สำเร็จ!`, type: 'success' }); onRefresh(); }
                        else setCheckInMessage({ text: '❌ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่อีกครั้ง', type: 'error' });
                    } else {
                        setCheckInMessage({ text: `❌ คุณอยู่ห่างจากโรงเรียน ${Math.round(distance)} เมตร (ต้องอยู่ในรัศมี ${settings.Radius} เมตร)`, type: 'error' });
                    }
                    setIsCheckingIn(false);
                };

                getPositionRobust()
                    .then((pos) => process(pos.coords.latitude, pos.coords.longitude))
                    .catch((err) => { setIsCheckingIn(false); setCheckInMessage({ text: geoErrorMessage(err), type: 'error' }); });
            };

            const myTodayStatus = {
                am: (attendanceMap[today] && attendanceMap[today][me.id] && attendanceMap[today][me.id].am) || null,
                pm: (attendanceMap[today] && attendanceMap[today][me.id] && attendanceMap[today][me.id].pm) || null
            };

            return (
                <div className="max-w-md mx-auto min-h-screen pb-16 bg-slate-50">
                    <div className="bg-emerald-600 text-white p-6 rounded-b-[2rem] shadow-lg">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold">ระบบเช็คชื่อนักเรียน</h2>
                            <div className="flex items-center gap-3">
                                <button onClick={onRefresh} className="text-emerald-100 hover:text-white" title="รีเฟรชข้อมูล">
                                    <i className={`fas fa-sync-alt ${refreshing ? 'animate-spin' : ''}`}></i>
                                </button>
                                <button onClick={onLogout} className="text-emerald-100 hover:text-white"><i className="fas fa-sign-out-alt text-xl"></i></button>
                            </div>
                        </div>
                        <div className="text-center">
                            <div className="w-20 h-20 bg-white rounded-full mx-auto flex items-center justify-center text-emerald-600 shadow-inner mb-3">
                                <i className="fas fa-user-graduate text-3xl"></i>
                            </div>
                            <h3 className="text-2xl font-bold">{me.name}</h3>
                            <p className="text-emerald-100 font-mono text-lg">{me.id}</p>
                        </div>
                    </div>

                    <div className="p-4 space-y-4 -mt-4">
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 text-center">
                            <h3 className="font-bold text-lg mb-1 text-slate-800">เช็คชื่อวันนี้</h3>
                            <p className="text-xs text-slate-400 mb-4">{thaiDate(today)}</p>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={() => handleCheckIn('am')} disabled={isCheckingIn || todayRec.am === 'present'}
                                    className={`p-4 rounded-xl font-bold flex flex-col items-center justify-center gap-2 transition-all ${todayRec.am === 'present' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white shadow-md active:scale-95'}`}>
                                    <i className={todayRec.am === 'present' ? "fas fa-check-circle text-2xl" : "fas fa-sun text-2xl"}></i>
                                    <span className="text-sm">รอบเช้า<br /><span className="text-xs font-normal">({decToTime(timeToDec(settings.AmStart) - Number(settings.EarlyMinutes || 0) / 60)}-{settings.AmEnd})</span></span>
                                </button>
                                <button onClick={() => handleCheckIn('pm')} disabled={isCheckingIn || todayRec.pm === 'present'}
                                    className={`p-4 rounded-xl font-bold flex flex-col items-center justify-center gap-2 transition-all ${todayRec.pm === 'present' ? 'bg-emerald-50 text-emerald-600 border border-emerald-200 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-md active:scale-95'}`}>
                                    <i className={todayRec.pm === 'present' ? "fas fa-check-circle text-2xl" : "fas fa-cloud-sun text-2xl"}></i>
                                    <span className="text-sm">รอบบ่าย<br /><span className="text-xs font-normal">({decToTime(timeToDec(settings.PmStart) - Number(settings.EarlyMinutes || 0) / 60)}-{settings.PmEnd})</span></span>
                                </button>
                            </div>
                            {checkInMessage && (
                                <div className={`mt-4 p-3 rounded-lg text-sm font-medium ${checkInMessage.type === 'error' ? 'bg-rose-50 text-rose-700 border border-rose-200' : checkInMessage.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-blue-50 text-blue-700 border border-blue-200'}`}>
                                    {checkInMessage.text}
                                </div>
                            )}
                        </div>

                        {phaseStats.map(({ phase, stats }) => (
                            <div key={phase.key} className={`p-5 rounded-2xl shadow-sm border ${stats.isAtRisk ? 'bg-rose-50 border-rose-100 text-rose-900' : 'bg-white border-slate-100'}`}>
                                <div className="flex justify-between items-start mb-2">
                                    <h4 className="font-bold text-sm"><i className="fas fa-calendar-alt mr-2"></i>{phase.name}</h4>
                                    <span className={`font-bold text-xl ${stats.isAtRisk ? 'text-rose-600' : 'text-emerald-600'}`}>{stats.percent.toFixed(1)}%</span>
                                </div>
                                <div className="w-full bg-slate-200 rounded-full h-2.5 mb-3">
                                    <div className={`h-2.5 rounded-full ${stats.isAtRisk ? 'bg-rose-500' : 'bg-emerald-500'}`} style={{ width: `${Math.min(100, stats.percent)}%` }}></div>
                                </div>
                                <div className="grid grid-cols-3 gap-2 text-center text-xs">
                                    <div className="bg-emerald-50 rounded-lg py-2"><div className="font-bold text-emerald-700 text-base">{stats.present}</div>มา (ครั้ง)</div>
                                    <div className="bg-amber-50 rounded-lg py-2"><div className="font-bold text-amber-700 text-base">{stats.leave}</div>ลา (ครั้ง)</div>
                                    <div className="bg-rose-50 rounded-lg py-2"><div className="font-bold text-rose-700 text-base">{stats.absent}</div>ขาด (ครั้ง)</div>
                                </div>
                                <p className="text-xs text-slate-500 mt-3 flex justify-between">
                                    <span>{stats.attendedHours} / {stats.totalHours} ชม.</span>
                                    <span>ต้องการ {phase.minPercent}%</span>
                                </p>
                                {stats.isAtRisk && <div className="mt-3 text-xs bg-rose-100 p-2 rounded text-rose-800"><i className="fas fa-exclamation-triangle"></i> ต่ำกว่าเกณฑ์ของช่วงนี้ ({phase.minPercent}%)</div>}
                            </div>
                        ))}

                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                            <h4 className="font-bold text-slate-800 mb-2"><i className="fas fa-layer-group mr-2"></i>ภาพรวมทั้งหมด</h4>
                            <p className="text-sm flex justify-between text-slate-600">
                                <span>มา {overall.present} / ลา {overall.leave} / ขาด {overall.absent} ครั้ง</span>
                                <span className="font-bold">{overall.percent.toFixed(1)}%</span>
                            </p>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                            <div className="px-5 pt-4 pb-3">
                                <h4 className="font-bold text-slate-800"><i className="fas fa-calendar-check mr-2"></i>สถานะของฉันวันนี้</h4>
                            </div>
                            <div className="px-5 pb-5 grid grid-cols-2 gap-3">
                                <div className="flex flex-col items-center gap-1 p-3 rounded-xl bg-slate-50 border border-slate-100">
                                    <span className="text-xs text-slate-500">รอบเช้า</span>
                                    <span className={`w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold border ${myTodayStatus.am ? STATUS_META[myTodayStatus.am].cls : 'bg-slate-100 text-slate-300 border-slate-200'}`}>
                                        {myTodayStatus.am ? STATUS_META[myTodayStatus.am].short : '-'}
                                    </span>
                                    <span className="text-xs text-slate-400">{myTodayStatus.am ? STATUS_META[myTodayStatus.am].label : 'ยังไม่เช็คชื่อ'}</span>
                                </div>
                                <div className="flex flex-col items-center gap-1 p-3 rounded-xl bg-slate-50 border border-slate-100">
                                    <span className="text-xs text-slate-500">รอบบ่าย</span>
                                    <span className={`w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold border ${myTodayStatus.pm ? STATUS_META[myTodayStatus.pm].cls : 'bg-slate-100 text-slate-300 border-slate-200'}`}>
                                        {myTodayStatus.pm ? STATUS_META[myTodayStatus.pm].short : '-'}
                                    </span>
                                    <span className="text-xs text-slate-400">{myTodayStatus.pm ? STATUS_META[myTodayStatus.pm].label : 'ยังไม่เช็คชื่อ'}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* ============================== TEACHER VIEW ============================== */
        function TeacherView({ roster, settings, rawSettings, attendanceMap, apiUrl, onLogout, onRefresh, refreshing, showToast }) {
            const [tab, setTab] = useState('attendance');
            const [editingStudent, setEditingStudent] = useState(null);
            const confirmArm = useConfirmArm();

            const deleteStudent = async (id) => {
                const ok = await apiPost(apiUrl, { action: 'deleteStudent', id });
                if (ok) { showToast('🗑️ ลบนักเรียนออกจากรายชื่อแล้ว', 'success'); onRefresh(); }
                else showToast('⚠️ ลบไม่สำเร็จ กรุณาลองใหม่', 'error');
            };

            const upsertStudent = async (data, originalId) => {
                const cleanId = String(data.id).trim();
                const cleanName = data.name.trim();
                if (!cleanId || !cleanName) { showToast('⚠️ กรุณากรอกรหัสและชื่อให้ครบ', 'error'); return false; }
                const dup = roster.find(s => s.id === cleanId && s.id !== originalId);
                if (dup) { showToast('⚠️️ มีรหัสนักเรียนนี้อยู่แล้วในระบบ', 'error'); return false; }
                const ok = await apiPost(apiUrl, { action: 'upsertStudent', id: cleanId, name: cleanName, totalHours: '', no: String(data.no || '').trim(), originalId });
                if (ok) { showToast(originalId ? '✅ บันทึกข้อมูลนักเรียนแล้ว' : '✅ เพิ่มนักเรียนใหม่แล้ว', 'success'); onRefresh(); return true; }
                showToast('⚠️ บันทึกไม่สำเร็จ กรุณาลองใหม่', 'error');
                return false;
            };

            return (
                <div className="min-h-screen bg-slate-100">
                    <header className="bg-slate-900 text-white p-4 sticky top-0 z-10 flex justify-between items-center no-print">
                        <div className="flex items-center gap-3">
                            <button onClick={onLogout} className="text-slate-400 hover:text-white"><i className="fas fa-sign-out-alt"></i></button>
                            <h1 className="font-bold text-lg">{settings.CampName} (ผู้สอน)</h1>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={onRefresh} className="text-slate-300 hover:text-white" title="รีเฟรชข้อมูล">
                                <i className={`fas fa-sync-alt ${refreshing ? 'animate-spin' : ''}`}></i>
                            </button>
                            <button onClick={() => setTab('attendance')} className={tab === 'attendance' ? 'text-blue-400' : 'text-slate-400'}><i className="fas fa-clipboard-check text-xl"></i></button>
                            <button onClick={() => setTab('reports')} className={tab === 'reports' ? 'text-blue-400' : 'text-slate-400'}><i className="fas fa-chart-bar text-xl"></i></button>
                            <button onClick={() => setTab('diagnostics')} className={tab === 'diagnostics' ? 'text-blue-400' : 'text-slate-400'} title="ทดสอบระบบ"><i className="fas fa-vial text-xl"></i></button>
                            <button onClick={() => setTab('settings')} className={tab === 'settings' ? 'text-blue-400' : 'text-slate-400'}><i className="fas fa-cog text-xl"></i></button>
                        </div>
                    </header>

                    <div className="p-4 md:p-8 max-w-6xl mx-auto">
                        {tab === 'attendance' && (
                            <AttendanceTab roster={roster} settings={settings} attendanceMap={attendanceMap} apiUrl={apiUrl}
                                onEdit={setEditingStudent} onAddNew={() => setEditingStudent('new')} deleteStudent={deleteStudent}
                                confirmArm={confirmArm} showToast={showToast} onRefresh={onRefresh} />
                        )}
                        {tab === 'reports' && <ReportsTab roster={roster} settings={settings} attendanceMap={attendanceMap} />}
                        {tab === 'diagnostics' && <DiagnosticsTab settings={settings} rawSettings={rawSettings} roster={roster} />}
                        {tab === 'settings' && (
                            <SettingsTab settings={settings} apiUrl={apiUrl} showToast={showToast} onRefresh={onRefresh} confirmArm={confirmArm} />
                        )}
                    </div>

                    {editingStudent && (
                        <StudentEditModal student={editingStudent === 'new' ? null : editingStudent}
                            onClose={() => setEditingStudent(null)}
                            onSave={async (data, originalId) => { const ok = await upsertStudent(data, originalId); if (ok) setEditingStudent(null); }} />
                    )}
                </div>
            );
        }

        function AttendanceTab({ roster, settings, attendanceMap, apiUrl, onEdit, onAddNew, deleteStudent, confirmArm, showToast, onRefresh }) {
            const [selectedDate, setSelectedDate] = useState(todayKey());
            const [search, setSearch] = useState('');
            const [pending, setPending] = useState({}); 
            const dayRec = attendanceMap[selectedDate] || {};
            const isToday = selectedDate === todayKey();

            // --- ส่วนที่ 1: ตรวจสอบเวลา 09.30 และ 13.30 ---
            const now = new Date();
            // ถ้าเป็นข้อมูลย้อนหลัง ถือว่าเลยเวลา 09.30/13.30 ของวันนั้นไปแล้วเสมอ
            const isAfter930 = !isToday || (now.getHours() > 9 || (now.getHours() === 9 && now.getMinutes() >= 30));
            const isAfter1330 = !isToday || (now.getHours() > 13 || (now.getHours() === 13 && now.getMinutes() >= 30));

            // กรองหาคนที่ยังไม่เช็คชื่อ
            const missingAmStudents = useMemo(() => roster.filter(s => !dayRec[s.id] || !dayRec[s.id].am), [roster, dayRec]);
            const missingPmStudents = useMemo(() => roster.filter(s => !dayRec[s.id] || !dayRec[s.id].pm), [roster, dayRec]);

            const handleCopyMissing = (session) => {
                const list = session === 'am' ? missingAmStudents : missingPmStudents;
                const text = list.map(s => {
                    const n = parseInt(s.no, 10);
                    const noStr = isNaN(n) ? (s.no || '-') : String(n).padStart(2, '0');
                    return `${noStr} ${s.name}`;
                }).join('\n');
                
                if (!text) {
                    showToast('ไม่มีรายชื่อให้คัดลอก', 'info');
                    return;
                }

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(`✅ คัดลอกรายชื่อรอบ${session === 'am' ? 'เช้า' : 'บ่าย'}แล้ว`, 'success');
                    }).catch(() => {
                        showToast('❌ คัดลอกไม่สำเร็จ', 'error');
                    });
                } else {
                    // Fallback สำหรับแอป LINE หรือ Browser เก่า
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        showToast(`✅ คัดลอกรายชื่อรอบ${session === 'am' ? 'เช้า' : 'บ่าย'}แล้ว`, 'success');
                    } catch (err) {
                        showToast('❌ ไม่สามารถคัดลอกอัตโนมัติได้', 'error');
                    }
                    document.body.removeChild(textArea);
                }
            };
            // ------------------------------------------

            const filteredRoster = useMemo(() => {
                const q = search.trim().toLowerCase();
                if (!q) return roster;
                return roster.filter(s => s.id.toLowerCase().includes(q) || s.name.toLowerCase().includes(q) || String(s.no || '').toLowerCase() === q);
            }, [roster, search]);

            const stats = useMemo(() => {
                let full = 0, partial = 0, hasAbsentOrLeave = 0, notChecked = 0;
                roster.forEach(s => {
                    const r = dayRec[s.id] || {};
                    if (r.am === 'present' && r.pm === 'present') full++;
                    else if (r.am === 'present' || r.pm === 'present') partial++;
                    if (r.am === 'absent' || r.pm === 'absent' || r.am === 'leave' || r.pm === 'leave') hasAbsentOrLeave++;
                    if (!r.am && !r.pm) notChecked++;
                });
                return { full, partial, hasAbsentOrLeave, notChecked };
            }, [dayRec, roster]);

            const getValue = (studentId, session) => {
                const key = `${studentId}-${session}`;
                if (key in pending) return pending[key];
                return (dayRec[studentId] && dayRec[studentId][session]) || null;
            };
            const isPending = (studentId, session) => `${studentId}-${session}` in pending;

            const setStatus = async (studentId, session, status) => {
                const key = `${studentId}-${session}`;
                setPending(p => ({ ...p, [key]: status }));
                const ok = await apiPost(apiUrl, { action: 'setStatus', date: selectedDate, studentId, session, status, method: 'teacher' });
                if (!ok) showToast('⚠️ บันทึกไม่สำเร็จ กรุณาลองใหม่', 'error');
                await onRefresh();
                setPending(p => { const n = { ...p }; delete n[key]; return n; });
            };

            const setLeaveDoc = async (studentId, session, doc) => {
                const currentStatus = (dayRec[studentId] && dayRec[studentId][session]) || 'leave';
                const ok = await apiPost(apiUrl, { action: 'setStatus', date: selectedDate, studentId, session, status: currentStatus, method: 'teacher', leaveDoc: doc });
                if (ok) onRefresh(); else showToast('⚠️ บันทึกไม่สำเร็จ กรุณาลองใหม่', 'error');
            };

            return (
                <div className="space-y-6">
                    <div className="flex flex-wrap justify-between items-end gap-3 no-print">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800">เช็คชื่อ / จัดการการเข้าเรียน</h2>
                            <div className="flex items-center gap-2 mt-2">
                                <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} className="border border-slate-300 rounded-lg px-3 py-1.5 text-sm" />
                                {!isToday && <span className="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded font-medium">กำลังแก้ไขข้อมูลย้อนหลัง</span>}
                                {isToday && <span className="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded font-medium">วันนี้</span>}
                            </div>
                        </div>
                        <button onClick={onAddNew} className="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-700">
                            <i className="fas fa-user-plus mr-1"></i> เพิ่มนักเรียน
                        </button>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 no-print">
                        <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                            <p className="text-sm text-emerald-700">มาครบวันนี้</p>
                            <p className="text-2xl font-bold text-emerald-800">{stats.full}</p>
                        </div>
                        <div className="bg-amber-50 p-4 rounded-xl border border-amber-200">
                            <p className="text-sm text-amber-700">มาแค่ครึ่งวัน</p>
                            <p className="text-2xl font-bold text-amber-800">{stats.partial}</p>
                        </div>
                        <div className="bg-rose-50 p-4 rounded-xl border border-rose-200">
                            <p className="text-sm text-rose-700">มีรอบขาด/ลา</p>
                            <p className="text-2xl font-bold text-rose-800">{stats.hasAbsentOrLeave}</p>
                        </div>
                        <div className="bg-slate-100 p-4 rounded-xl border border-slate-200">
                            <p className="text-sm text-slate-500">ยังไม่เช็คชื่อเลย</p>
                            <p className="text-2xl font-bold text-slate-600">{stats.notChecked}</p>
                        </div>
                    </div>

                    {/* --- ส่วนที่ 2: กล่องติดตามรายชื่อคนที่ยังไม่เช็คชื่อ --- */}
                    {(isAfter930 || isAfter1330) && (missingAmStudents.length > 0 || missingPmStudents.length > 0) && (
                        <div className="bg-rose-50 p-4 rounded-xl border border-rose-200 flex flex-col sm:flex-row justify-between items-center gap-4 no-print shadow-sm">
                            <div>
                                <h3 className="font-bold text-rose-800"><i className="fas fa-clipboard-list mr-2"></i>นักเรียนที่ยังไม่เช็คชื่อ</h3>
                                <p className="text-xs text-rose-600 mt-1">เลยกำหนดเวลาแล้ว (เช้า 09.30 / บ่าย 13.30) สามารถคัดลอกรายชื่อเพื่อไปตามตัวได้</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {isAfter930 && missingAmStudents.length > 0 && (
                                    <button onClick={() => handleCopyMissing('am')} className="bg-white hover:bg-rose-100 text-rose-700 border border-rose-300 px-3 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                                        <i className="far fa-copy mr-1"></i> คัดลอกรอบเช้า ({missingAmStudents.length})
                                    </button>
                                )}
                                {isAfter1330 && missingPmStudents.length > 0 && (
                                    <button onClick={() => handleCopyMissing('pm')} className="bg-white hover:bg-rose-100 text-rose-700 border border-rose-300 px-3 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                                        <i className="far fa-copy mr-1"></i> คัดลอกรอบบ่าย ({missingPmStudents.length})
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                    {/* ---------------------------------------------------- */}

                    <div className="relative no-print">
                        <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="ค้นหาจากรหัสหรือชื่อนักเรียน..."
                            className="w-full pl-9 pr-3 py-2.5 border border-slate-300 rounded-lg text-sm" />
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-100 border-b border-slate-200">
                                    <tr>
                                        <th className="p-3 font-semibold text-slate-700">เลขที่</th>
                                        <th className="p-3 font-semibold text-slate-700">รหัส</th>
                                        <th className="p-3 font-semibold text-slate-700">ชื่อ-สกุล</th>
                                        <th className="p-3 font-semibold text-slate-700">เช้า</th>
                                        <th className="p-3 font-semibold text-slate-700">บ่าย</th>
                                        <th className="p-3 font-semibold text-slate-700">หลักฐานการลา</th>
                                        <th className="p-3 font-semibold text-slate-700 text-center">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filteredRoster.length === 0 ? (
                                        <tr><td colSpan="7" className="p-6 text-center text-slate-500">{roster.length === 0 ? 'ยังไม่มีข้อมูลนักเรียน กด "เพิ่มนักเรียน" เพื่อเริ่มต้น' : 'ไม่พบนักเรียนที่ค้นหา'}</td></tr>
                                    ) : filteredRoster.map(s => {
                                        const rec = dayRec[s.id] || {};
                                        const delKey = 'del-' + s.id;

                                        // --- ส่วนที่ 3: เช็คเงื่อนไขทำไฮไลต์ให้คนที่ยังไม่เช็คชื่อ และเลยเวลา ---
                                        const notCheckedAm = !rec.am;
                                        const notCheckedPm = !rec.pm;
                                        const isMissingHighlight = (isAfter930 && notCheckedAm) || (isAfter1330 && notCheckedPm);
                                        
                                        const rowClass = `align-top transition-colors ${isMissingHighlight ? 'bg-rose-50/70 hover:bg-rose-100' : 'hover:bg-slate-50'}`;
                                        // ----------------------------------------------------------------------

                                        return (
                                            <tr key={s.id} className={rowClass}>
                                                <td className={`p-3 font-bold ${isMissingHighlight ? 'text-rose-700' : 'text-slate-700'}`}>{s.no || '-'}</td>
                                                <td className="p-3 font-mono text-slate-600">{s.id}</td>
                                                <td className={`p-3 font-medium ${isMissingHighlight ? 'text-rose-900' : 'text-slate-900'}`}>
                                                    {s.name}
                                                    {isMissingHighlight && <span className="ml-2 inline-flex items-center text-[10px] bg-rose-200 text-rose-800 px-1.5 py-0.5 rounded-full font-bold no-print">ยังไม่เช็คชื่อ</span>}
                                                </td>
                                                <td className="p-3">
                                                    <div className="flex items-center gap-2">
                                                        <SegmentedStatus value={getValue(s.id, 'am')} disabled={isPending(s.id, 'am')} onChange={(v) => setStatus(s.id, 'am', v)} />
                                                        {isPending(s.id, 'am') && <i className="fas fa-circle-notch fa-spin text-slate-400 text-xs"></i>}
                                                    </div>
                                                    <TimeHint rec={rec} session="am" />
                                                </td>
                                                <td className="p-3">
                                                    <div className="flex items-center gap-2">
                                                        <SegmentedStatus value={getValue(s.id, 'pm')} disabled={isPending(s.id, 'pm')} onChange={(v) => setStatus(s.id, 'pm', v)} />
                                                        {isPending(s.id, 'pm') && <i className="fas fa-circle-notch fa-spin text-slate-400 text-xs"></i>}
                                                    </div>
                                                    <TimeHint rec={rec} session="pm" />
                                                </td>
                                                <td className="p-3 min-w-[180px]">
                                                    {(rec.am === 'leave' || rec.pm === 'leave') ? (
                                                        <LeaveDocInput value={rec.leaveDoc || ''} onSave={(val) => setLeaveDoc(s.id, rec.am === 'leave' ? 'am' : 'pm', val)} />
                                                    ) : <span className="text-slate-300 text-xs">-</span>}
                                                </td>
                                                <td className="p-3">
                                                    <div className="flex items-center justify-center gap-2">
                                                        <button onClick={() => onEdit(s)} className="text-blue-600 bg-blue-50 hover:bg-blue-100 px-2.5 py-1.5 rounded-lg text-xs font-medium"><i className="fas fa-edit"></i></button>
                                                        <button onClick={() => confirmArm.isArmed(delKey) ? deleteStudent(s.id) : confirmArm.arm(delKey)}
                                                            className={`px-2.5 py-1.5 rounded-lg text-xs font-medium ${confirmArm.isArmed(delKey) ? 'bg-rose-600 text-white' : 'text-rose-600 bg-rose-50 hover:bg-rose-100'}`}>
                                                            {confirmArm.isArmed(delKey) ? 'ยืนยันลบ?' : <i className="fas fa-trash"></i>}
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // แสดงเวลาที่เช็คชื่อจริง (เวลาจากเซิร์ฟเวอร์) และวิธีเช็ค ใต้ปุ่มสถานะ
        function TimeHint({ rec, session }) {
            if (!rec || rec[session] !== 'present' || !rec[session + 'Time']) return null;
            const t = bkkTime(rec[session + 'Time']);
            if (!t) return null;
            const byTeacher = rec[session + 'Method'] === 'teacher';
            return (
                <div className="text-[11px] mt-1 text-slate-400">
                    {t.str} น. · {byTeacher ? 'ครูเช็คให้' : 'เช็คเอง'}
                </div>
            );
        }

        function LeaveDocInput({ value, onSave }) {
            const [local, setLocal] = useState(value);
            useEffect(() => setLocal(value), [value]);
            return (
                <input type="text" value={local} onChange={e => setLocal(e.target.value)} onBlur={() => { if (local !== value) onSave(local); }}
                    placeholder="เช่น ใบรับรองแพทย์" className="w-full p-1.5 border border-slate-300 rounded text-xs bg-amber-50" />
            );
        }

        function StudentEditModal({ student, onClose, onSave }) {
            const [id, setId] = useState(student ? student.id : '');
            const [name, setName] = useState(student ? student.name : '');
            const [no, setNo] = useState(student ? (student.no || '') : '');

            return (
                <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                        <div className="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                            <h3 className="font-bold text-slate-800 text-lg">{student ? 'แก้ไขข้อมูลนักเรียน' : 'เพิ่มนักเรียนใหม่'}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-rose-500"><i className="fas fa-times text-xl"></i></button>
                        </div>
                        <div className="p-5 space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">เลขที่ (ใช้เรียงลำดับและค้นหาเร็วๆ)</label>
                                <input type="number" min="1" value={no} onChange={e => setNo(e.target.value)} placeholder="เช่น 1" className="w-full p-2 border border-slate-300 rounded bg-slate-50 text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">รหัสประจำตัว</label>
                                <input type="text" value={id} onChange={e => setId(e.target.value)} className="w-full p-2 border border-slate-300 rounded bg-slate-50 text-sm" />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-slate-500 mb-1">ชื่อ-สกุล</label>
                                <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full p-2 border border-slate-300 rounded bg-slate-50 text-sm" />
                            </div>
                            <button onClick={() => onSave({ id, name, no }, student ? student.id : null)} className="w-full bg-blue-600 text-white font-bold p-3 rounded-xl mt-2 hover:bg-blue-700">บันทึกข้อมูล</button>
                        </div>
                    </div>
                </div>
            );
        }

        /* ============================== DIAGNOSTICS / TEST TAB ============================== */
        function DiagnosticsTab({ settings, rawSettings, roster }) {
            const [gpsResult, setGpsResult] = useState(null);
            const [locating, setLocating] = useState(false);
            const [simTime, setSimTime] = useState(() => { const n = new Date(); return `${pad2(n.getHours())}:${pad2(n.getMinutes())}`; });
            const [simDistance, setSimDistance] = useState('');

            const checkSettings = rawSettings || settings;
            const phases = parsePhases(checkSettings);

            const checks = useMemo(() => {
                const list = [];
                ['AmStart', 'AmEnd', 'PmStart', 'PmEnd'].forEach(k => {
                    const ok = TIME_RE.test(String(checkSettings[k]));
                    list.push({ label: `รูปแบบเวลา ${k} ("${checkSettings[k]}")`, ok, hint: ok ? '' : 'ควรเป็น HH:MM เช่น 08:30 — ค่านี้ยังเพี้ยนอยู่ในชีต Settings จริง แม้หน้าเว็บจะใช้ค่าสำรองแทนไปก่อนแล้วก็ตาม แนะนำให้ลบชีต Settings ทิ้งแล้วให้ระบบสร้างใหม่ หรือตรวจสอบว่า Deploy เวอร์ชันล่าสุดของ Apps Script แล้วจริง' });
                });
                const lat = Number(checkSettings.SchoolLat), lng = Number(checkSettings.SchoolLng);
                list.push({ label: 'พิกัดโรงเรียน (ละติจูด/ลองจิจูด)', ok: !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0, hint: 'ควรเป็นตัวเลขจริง ไม่ใช่ 0,0' });
                list.push({ label: 'รัศมีที่เช็คชื่อได้', ok: Number(checkSettings.Radius) > 0, hint: 'ควรมากกว่า 0 เมตร' });
                list.push({ label: 'ชั่วโมง/รอบเช้า-บ่าย', ok: Number(checkSettings.AmHours) > 0 && Number(checkSettings.PmHours) > 0, hint: 'ควรมากกว่า 0' });
                list.push({ label: 'ตั้งค่าช่วงเวลาการเข้าค่าย (Phases) แล้ว', ok: phases.length > 0, hint: 'ไปที่แท็บตั้งค่า เพิ่มอย่างน้อย 1 ช่วง' });
                phases.forEach((ph) => {
                    const validDates = !!ph.start && !!ph.end && new Date(ph.start) <= new Date(ph.end);
                    list.push({ label: `ช่วง "${ph.name}" วันที่ถูกต้อง`, ok: validDates, hint: 'วันเริ่มต้องมาก่อนหรือเท่ากับวันสิ้นสุด' });
                    const validPercent = Number(ph.minPercent) >= 0 && Number(ph.minPercent) <= 100;
                    list.push({ label: `ช่วง "${ph.name}" เกณฑ์ % ถูกต้อง`, ok: validPercent, hint: 'ควรอยู่ระหว่าง 0-100' });
                });
                list.push({ label: 'มีรายชื่อนักเรียนในระบบ', ok: roster.length > 0, hint: 'ไปที่แท็บเช็คชื่อ กด "เพิ่มนักเรียน"' });
                return list;
            }, [checkSettings, roster, phases]);

            const failCount = checks.filter(c => !c.ok).length;

            const testMyLocation = () => {
                if (!("geolocation" in navigator)) { setGpsResult({ error: 'อุปกรณ์นี้ไม่รองรับ GPS' }); return; }
                setLocating(true);
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const distance = getDistance(pos.coords.latitude, pos.coords.longitude, Number(settings.SchoolLat), Number(settings.SchoolLng));
                        setGpsResult({ distance, withinRadius: distance <= Number(settings.Radius) });
                        setLocating(false);
                    },
                    () => { setGpsResult({ error: 'ไม่สามารถเข้าถึง GPS ได้ กรุณากด "อนุญาต" การเข้าถึงตำแหน่ง' }); setLocating(false); },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            };

            const simDec = timeToDec(simTime || '00:00');
            const early = Number(settings.EarlyMinutes || 0) / 60;
            const amOpen = timeToDec(settings.AmStart) - early, amClose = timeToDec(settings.AmEnd);
            const pmOpen = timeToDec(settings.PmStart) - early, pmClose = timeToDec(settings.PmEnd);
            const amWindowOk = simDec >= amOpen && simDec <= amClose;
            const pmWindowOk = simDec >= pmOpen && simDec <= pmClose;

            const manualDistanceOk = simDistance !== '' ? Number(simDistance) <= Number(settings.Radius) : null;

            return (
                <div className="max-w-2xl space-y-6">
                    <div className="bg-blue-50 border border-blue-200 text-blue-800 text-sm p-4 rounded-xl">
                        <i className="fas fa-info-circle mr-1"></i> หน้านี้ใช้ตรวจสอบและจำลองการทำงานของระบบ <b>ไม่มีการบันทึกข้อมูลจริง</b> ปลอดภัยต่อการทดลองกดทุกปุ่ม
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-slate-800"><i className="fas fa-list-check text-emerald-600 mr-2"></i>ตรวจสอบการตั้งค่า</h2>
                            <span className={`text-xs font-bold px-2 py-1 rounded ${failCount === 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                                {failCount === 0 ? 'ผ่านทั้งหมด' : `พบปัญหา ${failCount} รายการ`}
                            </span>
                        </div>
                        <div className="space-y-2">
                            {checks.map((c, i) => (
                                <div key={i} className={`p-3 rounded-lg text-sm flex items-start gap-2 ${c.ok ? 'bg-emerald-50' : 'bg-rose-50'}`}>
                                    <i className={`fas ${c.ok ? 'fa-check-circle text-emerald-600' : 'fa-times-circle text-rose-600'} mt-0.5`}></i>
                                    <div>
                                        <div className={c.ok ? 'text-emerald-800' : 'text-rose-800 font-medium'}>{c.label}</div>
                                        {!c.ok && <div className="text-rose-600 text-xs mt-0.5">{c.hint}</div>}
                                    </div>
                                </div>
                            ))}
                        </div>
                        {failCount > 0 && (
                            <p className="text-xs text-slate-400 mt-3">หมายเหตุ: หน้าเช็คชื่อของนักเรียน/ครูจะไม่แสดงค่าที่เพี้ยนเหล่านี้ให้เห็น (ใช้ค่าสำรองแทนไปก่อนอัตโนมัติ) แต่ควรแก้ที่ต้นทางในชีตให้เรียบร้อยเพื่อความถูกต้อง</p>
                        )}
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-2"><i className="fas fa-location-crosshairs text-blue-600 mr-2"></i>จำลองการเช็คชื่อด้วย GPS จริง</h2>
                        <p className="text-sm text-slate-500 mb-4">กดทดสอบตำแหน่งปัจจุบันของอุปกรณ์นี้เทียบกับพิกัดโรงเรียนที่ตั้งไว้ (ไม่บันทึกจริง)</p>
                        <button onClick={testMyLocation} disabled={locating} className="w-full bg-blue-600 text-white p-3 rounded-lg font-medium disabled:opacity-50 mb-4">
                            {locating ? 'กำลังดึงตำแหน่ง...' : 'ทดสอบตำแหน่งปัจจุบันของฉัน'}
                        </button>
                        {gpsResult && gpsResult.error && (
                            <div className="bg-rose-50 text-rose-700 p-3 rounded-lg text-sm">{gpsResult.error}</div>
                        )}
                        {gpsResult && !gpsResult.error && (
                            <div className={`p-4 rounded-lg text-sm ${gpsResult.withinRadius ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800'}`}>
                                <p>ระยะห่างจากโรงเรียน: <b>{Math.round(gpsResult.distance)} เมตร</b> (รัศมีที่กำหนด {settings.Radius} เมตร)</p>
                                <p className="mt-1 font-bold">{gpsResult.withinRadius ? '✅ อยู่ในระยะที่เช็คชื่อได้' : '❌ อยู่นอกระยะที่เช็คชื่อได้'}</p>
                            </div>
                        )}
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-2"><i className="fas fa-ruler text-indigo-600 mr-2"></i>จำลองระยะห่างเอง (ไม่ต้องเดินไปจริง)</h2>
                        <p className="text-sm text-slate-500 mb-4">ใส่ระยะห่างสมมติจากโรงเรียน (เมตร) เพื่อดูว่าถ้าอยู่ไกลขนาดนี้จะเช็คชื่อได้หรือไม่ — ใช้ทดสอบกรณี "อยู่นอกพื้นที่" ได้โดยไม่ต้องเดินออกไปจริง</p>
                        <div className="flex gap-2">
                            <input type="number" min="0" value={simDistance} onChange={e => setSimDistance(e.target.value)} placeholder="เช่น 800" className="flex-1 p-2 border border-slate-300 rounded text-sm" />
                            <span className="flex items-center text-sm text-slate-500">เมตร</span>
                        </div>
                        {manualDistanceOk !== null && (
                            <div className={`mt-3 p-3 rounded-lg text-sm font-bold ${manualDistanceOk ? 'bg-emerald-50 text-emerald-800' : 'bg-rose-50 text-rose-800'}`}>
                                {manualDistanceOk ? `✅ อยู่ในระยะ (รัศมี ${settings.Radius} เมตร) — เช็คชื่อได้` : `❌ เกินระยะ (รัศมี ${settings.Radius} เมตร) — เช็คชื่อไม่ได้`}
                            </div>
                        )}
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <h2 className="text-xl font-bold text-slate-800 mb-2"><i className="fas fa-clock text-amber-600 mr-2"></i>จำลองช่วงเวลาเช็คชื่อ</h2>
                        <p className="text-sm text-slate-500 mb-4">ลองใส่เวลาสมมติ ดูว่าช่วงเวลานั้นเปิดให้เช็คชื่อรอบไหนได้บ้าง (ตามเกณฑ์เวลาที่ตั้งไว้ในแท็บตั้งค่า)</p>
                        <input type="time" value={simTime} onChange={e => setSimTime(e.target.value)} className="w-full p-2 border border-slate-300 rounded text-sm mb-4" />
                        <div className="grid grid-cols-2 gap-3">
                            <div className={`p-3 rounded-lg text-center text-sm font-medium ${amWindowOk ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-400'}`}>
                                รอบเช้า {amWindowOk ? '✅ เปิด' : '❌ ปิด'}<br /><span className="text-xs font-normal">({decToTimeSafe(amOpen)}-{settings.AmEnd})</span>
                            </div>
                            <div className={`p-3 rounded-lg text-center text-sm font-medium ${pmWindowOk ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-400'}`}>
                                รอบบ่าย {pmWindowOk ? '✅ เปิด' : '❌ ปิด'}<br /><span className="text-xs font-normal">({decToTimeSafe(pmOpen)}-{settings.PmEnd})</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        const decToTimeSafe = (dec) => { const h = Math.floor(((dec % 24) + 24) % 24); const m = Math.round((dec - Math.floor(dec)) * 60); return `${pad2(h)}:${pad2(m)}`; };


        function ReportsTab({ roster, settings, attendanceMap }) {
            const [view, setView] = useState('summary');
            const [onlyAtRisk, setOnlyAtRisk] = useState(false);
            const [search, setSearch] = useState('');
            const phases = parsePhases(settings);
            const groups = groupPhases(phases);

            const rows = useMemo(() => {
                return roster.map(s => {
                    const perGroup = groups.map(g => computeGroupStats(s.id, g, attendanceMap, settings));
                    const overall = computeOverallStats(s.id, phases, attendanceMap, settings);
                    const anyAtRisk = perGroup.some(p => p.isAtRisk);
                    return { ...s, perGroup, overall, anyAtRisk };
                }).sort((a, b) => a.overall.percent - b.overall.percent);
            }, [roster, attendanceMap, settings, phases, groups]);

            const visibleRows = useMemo(() => {
                let r = onlyAtRisk ? rows.filter(r => r.anyAtRisk) : rows;
                const q = search.trim().toLowerCase();
                if (q) r = r.filter(x => x.id.toLowerCase().includes(q) || x.name.toLowerCase().includes(q));
                return r;
            }, [rows, onlyAtRisk, search]);

            const exportExcel = () => {
                const data = rows.map((r, i) => {
                    const row = { 'ลำดับ': i + 1, 'รหัส': r.id, 'ชื่อ-สกุล': r.name };
                    r.perGroup.forEach((p, idx) => {
                        row[`${groups[idx].name} - มา`] = p.present;
                        row[`${groups[idx].name} - ลา`] = p.leave;
                        row[`${groups[idx].name} - ขาด`] = p.absent;
                        row[`${groups[idx].name} - %`] = Number(p.percent.toFixed(1));
                    });
                    row['รวมทั้งหมด %'] = Number(r.overall.percent.toFixed(1));
                    row['สถานะ'] = r.anyAtRisk ? 'เสี่ยงหมดสิทธิ์สอบ' : 'ผ่านเกณฑ์';
                    return row;
                });
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'รายงาน');
                XLSX.writeFile(wb, `รายงานเข้าเรียน_${todayKey()}.xlsx`);
            };

            return (
                <div className="space-y-6">
